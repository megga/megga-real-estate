<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEGGA · Conversation animée</title>
<style>
  :root {
    --ai: #00DA5F;
    --ai-text: #FFFFFF;
    --ai-time: rgba(255,255,255,0.82);
    --agent: #F1F3F5;
    --agent-text: #14181D;
    --agent-time: #8A929D;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
  }
  .canvas {
    width: 1166px;
    height: 730px;
    background: #FFFFFF;
    position: relative;
    overflow: hidden;
  }
  .thread {
    position: absolute;
    inset: 0;
    padding: 48px 96px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    gap: 18px;
  }
  .row {
    display: flex;
    width: 100%;
  }
  .row.left { justify-content: flex-start; }
  .row.right { justify-content: flex-end; }
  .row.cont { margin-top: -12px; }

  /* entrée */
  .enter {
    opacity: 0;
    transform: translateY(16px) scale(0.96);
    animation: pop .42s cubic-bezier(.18,.9,.28,1.2) forwards;
    transform-origin: bottom;
  }
  .row.right .enter { transform-origin: bottom right; }
  .row.left  .enter { transform-origin: bottom left; }
  @keyframes pop {
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .bubble {
    position: relative;
    max-width: 760px;
    padding: 22px 28px 16px;
    border-radius: 30px;
    box-shadow: 0 2px 6px rgba(15,23,42,0.07);
    font-size: 26px;
    line-height: 1.42;
    letter-spacing: -0.3px;
  }
  .bubble.ai {
    background: var(--ai);
    color: var(--ai-text);
    border-top-left-radius: 8px;
  }
  .bubble.ai::before {
    content: "";
    position: absolute;
    top: 0; left: -10px;
    width: 12px; height: 20px;
    background: var(--ai);
    clip-path: polygon(0 0, 100% 0, 100% 100%);
  }
  .bubble.agent {
    background: var(--agent);
    color: var(--agent-text);
    border-top-right-radius: 8px;
  }
  .bubble.agent::before {
    content: "";
    position: absolute;
    top: 0; right: -10px;
    width: 12px; height: 20px;
    background: var(--agent);
    clip-path: polygon(0 0, 100% 0, 0 100%);
  }
  .bubble.notail { border-radius: 30px; }
  .bubble.notail::before { display: none; }

  .bubble p { margin: 0; }
  .bubble .lead { font-weight: 700; }
  .bubble .quote { margin-top: 10px; }

  .meta {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 6px;
    margin-top: 8px;
    font-size: 16px;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .ai .meta { color: var(--ai-time); }
  .agent .meta { color: var(--agent-time); }
  .ticks { display: inline-flex; align-items: center; }
  .ticks svg { display: block; }

  /* indicateur de saisie */
  .typing {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 24px 28px;
    border-radius: 30px;
    box-shadow: 0 2px 6px rgba(15,23,42,0.07);
    background: var(--ai);
    border-top-left-radius: 8px;
  }
  .typing.agent { background: var(--agent); border-top-left-radius: 30px; border-top-right-radius: 8px; }
  .typing .dot {
    width: 11px; height: 11px; border-radius: 50%;
    background: rgba(255,255,255,0.9);
    animation: blink 1.3s infinite ease-in-out;
  }
  .typing.agent .dot { background: #A7AEB8; }
  .typing .dot:nth-child(2) { animation-delay: .18s; }
  .typing .dot:nth-child(3) { animation-delay: .36s; }
  @keyframes blink {
    0%, 60%, 100% { opacity: .3; transform: translateY(0); }
    30% { opacity: 1; transform: translateY(-4px); }
  }
</style>
</head>
<body>
  <div class="canvas">
    <div class="thread" id="thread"></div>
  </div>

<script>
const TICKS = `<span class="ticks"><svg width="22" height="15" viewBox="0 0 16 11" fill="none">
  <path d="M1 5.8 4 8.8 9.4 2.4" stroke="#8A929D" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M6.6 5.8 9.6 8.8 15 2.4" stroke="#8A929D" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg></span>`;

// side: 'agent' (droite) | 'ai' (gauche)
// think: durée de l'indicateur "..." avant la bulle (ms). 0 = pas d'indicateur (envoi direct)
const SCRIPT = [
  { side:'agent', think:0,    html:`<p>Salut MEGGA 👋 tu peux me préparer l'annonce du 4,5 pièces à Genève ?</p><div class="meta"><span>14:30</span>${TICKS}</div>` },
  { side:'ai',    think:1100, html:`<p>Bien sûr 🙂 Plutôt sobre ou prestige ?</p><div class="meta"><span>14:30</span></div>` },
  { side:'agent', think:900,  html:`<p>Prestige</p><div class="meta"><span>14:31</span>${TICKS}</div>` },
  { side:'ai',    think:1000, html:`<p>Parfait, je vous prépare ça.</p><div class="meta"><span>14:31</span></div>`, notail:true },
  { side:'ai',    think:1600, cont:true, html:`<p class="lead">« Genève · 4,5 pièces d'exception, 118 m² »</p><p class="quote">« Réception traversante et lumineuse, deux terrasses, à deux pas du parc Bertrand. Une adresse rare au cœur de la ville. »</p><div class="meta"><span>14:32</span></div>` },
  { side:'agent', think:1400, html:`<p>Nickel 🙌 ajoute juste la proximité des écoles</p><div class="meta"><span>14:32</span>${TICKS}</div>` },
  { side:'ai',    think:1500, html:`<p>C'est ajouté. Je l'ai aussi adaptée pour les réseaux et en SMS. Vous validez quand vous voulez 👍</p><div class="meta"><span>14:33</span></div>` },
];

const thread = document.getElementById('thread');
const wait = ms => new Promise(r => setTimeout(r, ms));

function makeRow(cont) {
  const row = document.createElement('div');
  row.className = 'row';
  return row;
}

async function run() {
  for (const m of SCRIPT) {
    const row = document.createElement('div');
    row.className = 'row ' + (m.side === 'agent' ? 'right' : 'left') + (m.cont ? ' cont' : '');
    thread.appendChild(row);

    // indicateur de saisie
    if (m.think > 0) {
      const t = document.createElement('div');
      t.className = 'typing enter ' + (m.side === 'agent' ? 'agent' : '');
      t.innerHTML = `<span class="dot"></span><span class="dot"></span><span class="dot"></span>`;
      row.appendChild(t);
      await wait(m.think);
      row.removeChild(t);
    }

    // bulle
    const b = document.createElement('div');
    b.className = 'bubble enter ' + m.side + (m.notail ? ' notail' : '');
    b.innerHTML = m.html;
    row.appendChild(b);
    await wait(m.side === 'agent' ? 650 : 900);
  }
}

async function loop() {
  while (true) {
    thread.innerHTML = '';
    await run();
    await wait(2600);
    // fondu de sortie
    thread.style.transition = 'opacity .5s ease';
    thread.style.opacity = '0';
    await wait(600);
    thread.style.transition = 'none';
    thread.style.opacity = '1';
    await wait(400);
  }
}
loop();
</script>
</body>
</html>

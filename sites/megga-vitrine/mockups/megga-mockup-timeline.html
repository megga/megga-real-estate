<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MEGGA — Mockup Timeline incliné</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{
    --cyan:#0891B2; --orange:#C45A00; --green:#059669; --blue:#1E5BC6; --ink:#0B0C0E;
    --slate:#5A6573; --slateMut:#6B7480;
    --screenBg:#0C0D11; --surface:#16181E; --surfaceHead:#1B1E25;
    --line:rgba(255,255,255,0.10); --lineSoft:rgba(255,255,255,0.055);
    --txt:#F4F6F8; --sub:#8A929D; --soft:#C3C9D1;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ zoom:0.62; }
  html,body{ font-family:"Manrope",ui-sans-serif,system-ui,sans-serif; }
  body{ width:1320px; height:860px; overflow:hidden; background:transparent; }

  /* ---- capture frame (fixed size) ---- */
  #capture{ position:relative; width:1320px; height:860px; background:transparent; }

  /* ---- Stage / 3D ---- */
  .stage{ position:absolute; inset:0; perspective:2400px; perspective-origin:50% 46%; }
  .tilt{
    position:absolute; left:50%; top:50%;
    transform: translate(-50%,-50%) rotateX(37deg) rotateY(0deg) scale(0.84);
    transform-style:preserve-3d;
  }
  .chips{ position:absolute; inset:0; z-index:6; pointer-events:none; }

  /* ---- Browser window ---- */
  .browser{
    width:1440px; border-radius:18px; overflow:hidden;
    background:var(--screenBg);
    box-shadow:
      0 2px 4px rgba(0,0,0,.4),
      0 40px 80px rgba(0,0,0,.55),
      0 90px 160px rgba(0,0,0,.45);
    outline:1px solid rgba(255,255,255,0.06);
  }
  .chrome{
    height:46px; background:#1A1C22; display:flex; align-items:center; padding:0 18px; gap:9px;
    border-bottom:1px solid rgba(255,255,255,0.06);
  }
  .dot{ width:12px; height:12px; border-radius:999px; }
  .dot.r{ background:#FF5F57; } .dot.y{ background:#FEBC2E; } .dot.g{ background:#28C840; }

  .screen{ background:var(--screenBg); padding:34px 38px 44px; }

  /* top nav */
  .topnav{ display:flex; align-items:center; gap:36px; margin-bottom:30px; }
  .logo{ font-size:30px; font-weight:800; letter-spacing:-1px; color:var(--txt); }
  .nav{ display:flex; align-items:center; gap:26px; margin:0 auto 0 0; }
  .nav a{ font-size:14.5px; color:var(--sub); font-weight:600; text-decoration:none; }
  .nav a.act{ color:var(--ink); background:#fff; padding:9px 18px; border-radius:999px; }
  .navtools{ display:flex; align-items:center; gap:12px; }
  .ntbtn{ width:38px; height:38px; border-radius:999px; background:#1B1E25; display:grid; place-items:center; }
  .avatarMe{ width:40px;height:40px;border-radius:999px;background:linear-gradient(135deg,#2563EB,#1E40AF);display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px; }

  /* heading row */
  .headrow{ display:flex; align-items:flex-end; margin-bottom:24px; }
  .h1{ font-size:46px; font-weight:800; color:var(--txt); letter-spacing:-1.4px; }
  .toggle{ margin-left:auto; display:flex; align-items:center; gap:14px; }
  .seg{ background:#16181E; border-radius:999px; padding:5px; display:flex; gap:2px; box-shadow:inset 0 0 0 1px rgba(255,255,255,0.05); }
  .seg button{ border:0; background:transparent; color:var(--sub); font-family:inherit; font-weight:700; font-size:13.5px; padding:9px 18px; border-radius:999px; cursor:pointer; }
  .seg button.on{ background:#F4F6F8; color:var(--ink); }
  .btnGhost{ background:#16181E; color:var(--soft); border:0; font-family:inherit; font-weight:700; font-size:13.5px; padding:12px 20px; border-radius:999px; box-shadow:inset 0 0 0 1px rgba(255,255,255,0.06); }
  .btnDark{ background:#fff; color:var(--ink); border:0; font-family:inherit; font-weight:800; font-size:13.5px; padding:13px 22px; border-radius:999px; }

  /* stat cards */
  .stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:18px; margin-bottom:26px; }
  .stat{ background:var(--surface); border-radius:18px; padding:20px 22px; box-shadow:0 1px 3px rgba(0,0,0,.3), inset 0 0 0 1px rgba(255,255,255,0.045); }
  .stat .lbl{ font-size:11px; font-weight:700; letter-spacing:.8px; color:var(--sub); text-transform:uppercase; }
  .stat .val{ font-size:30px; font-weight:800; margin-top:10px; letter-spacing:-.5px; font-variant-numeric:tabular-nums; }

  /* timeline */
  .tl{ background:var(--surface); border:1px solid var(--line); border-radius:22px; overflow:hidden; box-shadow:0 1px 3px rgba(0,0,0,.3); }
  .tlhead{ display:flex; background:var(--surfaceHead); border-bottom:1px solid var(--line); }
  .tlhead .dealcol{ width:240px; padding:15px 20px; border-right:1px solid var(--line); font-size:11px; font-weight:700; letter-spacing:.4px; text-transform:uppercase; color:var(--sub); }
  .tlhead .days{ flex:1; display:grid; grid-template-columns:repeat(10,1fr); }
  .tlhead .day{ padding:15px 0; text-align:center; font-size:11.5px; color:var(--sub); font-weight:600; border-right:1px solid var(--lineSoft); }
  .tlhead .day:last-child{ border-right:0; }

  .row{ display:flex; }
  .row:not(:last-child){ border-bottom:1px solid var(--line); }
  .row.zebra{ background:rgba(255,255,255,0.022); }
  .row .dealcol{ width:240px; padding:13px 20px; border-right:1px solid var(--line); display:flex; align-items:center; gap:11px; }
  .av{ width:30px;height:30px;border-radius:999px;display:grid;place-items:center;color:#fff;font-size:10.5px;font-weight:700;flex-shrink:0; }
  .dealcol .name{ font-size:13px; font-weight:700; color:var(--txt); }
  .dealcol .price{ font-size:11px; color:var(--sub); margin-top:1px; font-variant-numeric:tabular-nums; }
  .track{ flex:1; position:relative; display:grid; grid-template-columns:repeat(10,1fr); height:66px; }
  .track .cell{ border-right:1px solid var(--lineSoft); }
  .track .cell:last-child{ border-right:0; }
  .bar{ position:absolute; top:15px; height:36px; border-radius:12px; padding:0 14px; display:flex; align-items:center; font-size:12px; font-weight:700; color:#fff; white-space:nowrap; box-shadow:0 4px 12px rgba(0,0,0,.28); }

  /* ---- floating chips ---- */
  .chip{ position:absolute; display:flex; align-items:center; gap:8px; padding:9px 15px; border-radius:999px; font-size:14px; font-weight:700; color:#fff; white-space:nowrap; box-shadow:0 16px 40px rgba(0,0,0,.4); }
  .chip .cursor{ position:absolute; }
  .chip.ai{ background:var(--ink); padding:10px 17px 10px 13px; box-shadow:0 18px 46px rgba(0,0,0,.5); }
  .chip.ai .spark{ display:grid; place-items:center; }
  .chip.ai .sub{ font-weight:500; color:#B7BDC6; font-size:13px; }
  .chip.pres-b{ background:var(--blue); }
  .chip.pres-c{ background:var(--cyan); }
  .chip.status{ background:var(--orange); }

  /* cursor arrow */
  .curArrow{ position:absolute; }
</style>
</head>
<body>
  <template id="__bundler_thumbnail">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
      <rect width="100" height="100" rx="16" fill="#0C0D11"/>
      <rect x="22" y="30" width="56" height="40" rx="5" fill="#16181E" transform="rotate(-6 50 50)"/>
      <rect x="30" y="40" width="20" height="6" rx="3" fill="#0891B2" transform="rotate(-6 50 50)"/>
      <rect x="38" y="52" width="26" height="6" rx="3" fill="#C45A00" transform="rotate(-6 50 50)"/>
    </svg>
  </template>

  <div id="capture">
  <div class="stage">
    <div class="tilt" id="tilt">
      <div class="browser" id="browser">
        <div class="screen">

          <div class="topnav">
            <nav class="nav">
              <a>Aujourd'hui</a>
              <a class="act">Pipeline</a>
              <a>Matching</a>
              <a>Parcours</a>
              <a>Contacts</a>
              <a>Mes biens</a>
              <a>Calendrier</a>
            </nav>
            <div class="navtools">
              <div class="ntbtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A929D" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.2-3.2"/></svg></div>
              <div class="ntbtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A929D" stroke-width="1.8"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg></div>
              <div class="avatarMe">LR</div>
            </div>
          </div>

          <div class="headrow">
            <div class="h1">Pipeline</div>
            <div class="toggle">
              <div class="seg">
                <button>Kanban</button>
                <button>Liste</button>
                <button class="on">Timeline</button>
              </div>
              <button class="btnGhost">Importer un lead</button>
              <button class="btnDark">Nouveau deal</button>
            </div>
          </div>

          <div class="stats">
            <div class="stat"><div class="lbl">Pipeline actif</div><div class="val" style="color:var(--txt)">8</div></div>
            <div class="stat"><div class="lbl">Valeur totale</div><div class="val" style="color:#5B8DEF">CHF 8.49M</div></div>
            <div class="stat"><div class="lbl">À risque</div><div class="val" style="color:#E0922F">3</div></div>
            <div class="stat"><div class="lbl">Conversion</div><div class="val" style="color:#2FB36B">18%</div></div>
          </div>

          <div class="tl">
            <div class="tlhead">
              <div class="dealcol">Deal</div>
              <div class="days">
                <div class="day">1 mai</div><div class="day">2 mai</div><div class="day">3 mai</div><div class="day">4 mai</div><div class="day">5 mai</div>
                <div class="day">6 mai</div><div class="day">7 mai</div><div class="day">8 mai</div><div class="day">9 mai</div><div class="day">10 mai</div>
              </div>
            </div>
            <!-- rows injected -->
            <div id="rows"></div>
          </div>

        </div>
      </div>
    </div>
  </div>

  <div class="chips">
    <div class="chip pres-c" style="left:905px; top:545px;">
      Marc Dubois
      <svg class="curArrow" style="left:-27px; top:-19px;" width="34" height="34" viewBox="0 0 24 24" fill="#0891B2" stroke="#fff" stroke-width="1.4"><path d="M5 3l14 7-6 2-2 6z"/></svg>
    </div>
  </div>
  </div>

<script>
  // avatar palette
  var AV = { MB:"#2563EB", PV:"#8B5CF6", ES:"#0D9488", CR:"#2563EB", AP:"#3056D3" };
  // bar colors
  var C = { cyan:"#0891B2", orange:"#C45A00", slate:"#5A6573", slateMut:"#737C89", green:"#059669" };
  // rows: [initials, name, price, [ {label,color,left%,width%} ]]
  var ROWS = [
    ["MB","Marie Bertrand","CHF 1'100'000",[{l:"Visite effectuée",c:C.cyan,x:0,w:22}]],
    ["MB","Marie Bertrand","CHF 850'000",[{l:"Offre déposée",c:C.orange,x:20,w:32}]],
    ["PV","Pierre Vionnet","CHF 1'800'000",[{l:"Recherche active",c:C.slate,x:42,w:29}]],
    ["ES","Élodie Schmidt","CHF 850'000",[{l:"Intérêt confirmé",c:C.slateMut,x:7,w:20}]],
    ["CR","Camille Rougier","CHF 38'400",[{l:"Visite planifiée",c:C.slate,x:21,w:21}]],
    ["AP","Antoine Picard","CHF 3'850'000",[{l:"Offre déposée",c:C.orange,x:0,w:21}]]
  ];
  var host = document.getElementById('rows');
  ROWS.forEach(function(r,i){
    var row = document.createElement('div');
    row.className = 'row' + (i%2===1?' zebra':'');
    var cells = '';
    for(var k=0;k<10;k++){ cells += '<div class="cell"></div>'; }
    var bars = r[3].map(function(b){
      return '<div class="bar" style="left:'+b.x+'%;width:'+b.w+'%;background:'+b.c+'">'+b.l+'</div>';
    }).join('');
    row.innerHTML =
      '<div class="dealcol">'+
        '<div class="av" style="background:'+AV[r[0]]+'">'+r[0]+'</div>'+
        '<div><div class="name">'+r[1]+'</div><div class="price">'+r[2]+'</div></div>'+
      '</div>'+
      '<div class="track">'+cells+bars+'</div>';
    host.appendChild(row);
  });
</script>
</body>
</html>

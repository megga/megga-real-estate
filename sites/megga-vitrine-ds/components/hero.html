<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hero — MEGGA Vitrine</title>
  <link href="https://fonts.googleapis.com" rel="preconnect" />
  <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link href="../css/styles.css" rel="stylesheet" type="text/css" />
  <style>
    body { margin: 0; font-family: "Inter Tight", sans-serif; background: var(--neutral-colors--100); color: var(--neutral-colors--700); }
    /* neutralise les états cachés des animations Webflow IX2 (pas de JS runtime dans la preview statique) */
    [style*="opacity:0"], [style*="opacity: 0"] { opacity: 1 !important; }
    [style*="opacity:0"] *, [style*="opacity: 0"] * { opacity: 1 !important; }
    /* neutralise aussi le flou des entrées IX2 pour un rendu net */
    [style*="blur"] { filter: none !important; }

    /* Ce qui suit est la COPIE CONFORME du bloc inline de index.html : ces
       classes ne vivent pas dans styles.css, elles sont écrites à la main dans
       la page. ⚠ La preview n'a aucun JS, donc `--hero-descente` reste à 0 :
       c'est la pose de repos qui s'affiche ici, jamais la descente.

       Hero CRM — scène perspective 3D (maquette « Matching — couverture 3D ») + dégradé conservé.
       Géométrie en unités RELATIVES à la boîte du visuel : la pose de la maquette
       (écran DE FACE, basculé de 52°, à peine vrillé de 10°) tient telle quelle à
       toutes les largeurs. La hauteur du hero reste réglée par le seul
       `aspect-ratio` ci-dessous — aucune transformation ne la fait grandir, donc la
       ligne de logos qui suit ne bouge pas d'un pixel.
       ⚠ Un seul écart à la maquette, et il est voulu : elle pose le bord haut de
       l'écran à 34 % parce qu'elle réserve son tiers haut au titre de couverture.
       Ici ce tiers est occupé par le titre du hero, donc l'écran commence juste
       sous les boutons (4 %). Le point de fuite reste AU-DESSUS de ce bord (-10 %,
       soit hors de la boîte) : c'est lui qui donne le regard plongeant, et le
       remettre à 20 % ferait bomber le haut de l'écran vers le ciel.
       `--hero-rx/rz/scale` = la pose de repos, `--hero-d*` = le chemin parcouru
       pendant la descente. Le script n'écrit QUE `--hero-descente` (0 → 1) : la
       géométrie reste entièrement ici, points de rupture compris. */
    .crm-hero-visual{position:relative;width:100%;aspect-ratio:2880/1496;margin-top:64px;
      --hero-rx:52deg;--hero-rz:-10deg;--hero-scale:.68;
      --hero-descente:0;--hero-drx:20deg;--hero-drz:10deg;--hero-dscale:.12;--hero-dy:-52px;}
    .section.hero---br.v3 .buttons-row{margin-top:24px;}
    .crm-hero-glow{position:absolute;z-index:3;left:-3%;right:-3%;bottom:0;height:46%;pointer-events:none;
      background:linear-gradient(90deg,
        rgb(34,4,171) 0%, rgb(34,4,184) 8%, rgb(33,6,198) 17%, rgb(31,12,216) 25%,
        rgb(37,32,252) 33%, rgb(57,36,255) 42%, rgb(105,36,253) 50%, rgb(136,41,251) 58%,
        rgb(136,41,251) 67%, rgb(123,38,180) 75%, rgb(119,27,142) 83%, rgb(116,13,112) 92%, rgb(109,11,105) 100%);
      -webkit-mask-image:linear-gradient(to top,#000 0%,#000 6%,rgba(0,0,0,.6) 34%,transparent 86%);
      mask-image:linear-gradient(to top,#000 0%,#000 6%,rgba(0,0,0,.6) 34%,transparent 86%);
      filter:blur(8px);}
    /* La scène épouse le visuel. La focale suit la largeur de page (104vw ≈ les
       2000px de la maquette sur ses 1920px de large) : figée en pixels, elle
       aplatirait l'écran sur grand moniteur et le creuserait sur petit. */
    .crm-hero-stage{position:absolute;z-index:2;inset:0;perspective:104vw;perspective-origin:50% -10%;}
    .crm-hero-device{position:absolute;left:50%;top:4%;width:130%;
      transform:translateX(-50%)
        translateY(calc(var(--hero-descente) * var(--hero-dy)))
        rotateX(calc(var(--hero-rx) - var(--hero-descente) * var(--hero-drx)))
        rotateZ(calc(var(--hero-rz) + var(--hero-descente) * var(--hero-drz)))
        scale(calc(var(--hero-scale) + var(--hero-descente) * var(--hero-dscale)));
      transform-origin:50% 0;border-radius:30px;overflow:hidden;background:#0a0a0c;border:1px solid rgba(255,255,255,.08);
      box-shadow:0 80px 160px -24px rgba(0,0,0,.6),0 24px 60px -40px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.03) inset;
      will-change:transform;}
    .crm-hero-device img{display:block;width:100%;height:auto;}
    /* Sous 768px la boîte est très large pour sa hauteur : on redresse un peu et
       on rapproche, sinon l'écran se réduit à une bande illisible. */
    @media screen and (max-width:767px){
      .crm-hero-visual{--hero-rx:46deg;--hero-rz:-8deg;--hero-scale:.74;--hero-drx:14deg;--hero-drz:8deg;--hero-dy:-30px;}
    }
    /* Personne n'a demandé à voyager : sans mouvement, il reste la pose de la
       maquette, qui se tient toute seule. */
    @media (prefers-reduced-motion:reduce){
      .crm-hero-visual{--hero-drx:0deg;--hero-drz:0deg;--hero-dscale:0;--hero-dy:0px;}
    }
  </style>
</head>

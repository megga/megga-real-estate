<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- app.megga.ch = CRM agent privé : rien à indexer. Tout est derrière
         authentification, et les rares pages publiques sont des liens tokenisés
         (portail vendeur, visites, KYC) qui ne doivent pas être crawlés.
         La vitrine indexable vit sur megga.ch (sites/megga-vitrine). -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="MEGGA — CRM immobilier suisse. Espace de travail des agents." />
    <meta name="theme-color" content="#14161C" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://eayczugyrvmtqnnmvjod.supabase.co" crossorigin />
    <link rel="preconnect" href="https://api.mapbox.com" crossorigin />
    <link rel="preconnect" href="https://accounts.google.com" crossorigin />
    <link rel="dns-prefetch" href="https://eayczugyrvmtqnnmvjod.supabase.co" />
    <link rel="dns-prefetch" href="https://api.mapbox.com" />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Manrope — experimental Acreon direction on seller portal (MonDossier) -->
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <!-- Inter Tight — typo du CRM agent (pages Sugar) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <!-- Plus Jakarta Sans — fallback Property X (proche d'Objectivity, géométrie similaire) -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>MEGGA — CRM immobilier</title>
    <script>
      // Aucune mesure d'audience sur les routes à lien tokenisé : `gtag('config', …)`
      // envoie `document.location.href` à Google, c'est-à-dire le token lui-même —
      // dans le chemin (/kyc, /kyc-report, /reception, /rendez-vous) ou dans la query (?token= des
      // pages de visite). Un capability token remis à un tiers est un token compromis.
      //
      // Le test se fait AU CHARGEMENT, à dessein : ce sont des pages d'ARRIVÉE, on y
      // atterrit depuis un e-mail ou un lien WhatsApp, jamais par navigation interne.
      // Ne pas « améliorer » en hook de routeur : les mouchards se chargent ici, dans
      // <head>, bien avant React — un hook arriverait après la fuite.
      // `visite` = alias FR redirigé au bord (Cloudflare conserve la query au 301) ;
      // gardé ici parce que le SPA sert aussi ces chemins hors Cloudflare (dev).
      //
      // `/auth` couvre le sous-arbre ENTIER, pas seulement `/auth/callback` : le client
      // Supabase ne fixe pas `flowType`, donc le flux implicite fait atterrir la session
      // dans le FRAGMENT (`#access_token=…&refresh_token=…`). Le `refresh_token` est le
      // secret le plus lourd de l'application — bien plus qu'un jeton de visite — et il
      // traverse aussi la récupération de mot de passe. Un sous-arbre entier est plus sûr
      // qu'une liste de chemins qu'on oubliera d'étendre ; l'audience y est sans valeur,
      // l'entonnoir d'inscription vivant sur la vitrine.
      // `/accept-invite/<token>` porte une invitation d'équipe encore active.
      //
      // ⚠ Cette expression est jumelle de `isTokenBearingPath` (src/lib/sentry.ts) —
      // deux runtimes, aucun import possible entre eux. `tests/unit/token-routes.spec.ts`
      // les compare caractère par caractère : étendre l'une sans l'autre rougit.
      window.MEGGA_ROUTE_TOKENISEE =
        /^\/(kyc-report|kyc|reception|rendez-vous|visit|visite|accept-invite|auth)(\/|$)/i.test(location.pathname);
    </script>
    <!-- Google Tag Manager -->
    <script>if (!window.MEGGA_ROUTE_TOKENISEE) { (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-TFVCHXFJ'); }</script>
    <!-- End Google Tag Manager -->
    <!-- Google tag (gtag.js) — injecté par script plutôt que posé en dur : sur une
         route tokenisée, la balise ne doit même pas être téléchargée. -->
    <script>
      (function () {
        if (window.MEGGA_ROUTE_TOKENISEE) return;
        window.dataLayer = window.dataLayer || [];
        window.gtag = function () { window.dataLayer.push(arguments); };
        var tag = document.createElement('script');
        tag.async = true;
        tag.src = 'https://www.googletagmanager.com/gtag/js?id=G-W8QK7C0NB1';
        document.head.appendChild(tag);
        window.gtag('js', new Date());
        window.gtag('config', 'G-W8QK7C0NB1');
      })();
    </script>
    <script>
      // Pre-set theme BEFORE React renders to prevent white flash (FOUC)
      // Only apply if user explicitly chose dark (not system preference — public pages stay light)
      (function() {
        try {
          var t = localStorage.getItem('megga-theme');
          if (t === 'dark' && /\/dashboard/.test(location.pathname)) {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch(e) {}
      })();
    </script>
    <script>
      // Écran d'arrivée (#megga-boot) : UNIQUEMENT sur le trajet qui mène au CRM.
      // Les autres routes publiques (portail vendeur, KYC client, visites) sont
      // claires — un flash sombre y serait un défaut, pas une transition.
      // Décidé ici, dans <head>, pour que le corps se peigne déjà dans le bon état.
      (function () {
        var p = location.pathname;
        if (p === '/' || p === '/auth/callback' || p.indexOf('/dashboard') === 0) {
          document.documentElement.classList.add('megga-booting');
        }
      })();
    </script>
    <!-- Écran d'arrivée post-connexion — habillage de la vitrine (megga.ch).
         Inline (styles + logo) à dessein : il doit peindre dès la PREMIÈRE frame,
         avant le bundle React, sinon l'agent qui revient de megga.ch/login voit
         une page blanche pendant que le JS se télécharge.
         ⚠ Le jumeau React (src/components/layout/BootSplash.tsx) RÉUTILISE ces
         classes et rejoue ce balisage : les deux doivent rester identiques au
         pixel, sinon la bascule HTML → React clignote. -->
    <style id="megga-boot-style">
      .megga-boot {
        position: fixed;
        inset: 0;
        z-index: 9998;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        /* Tokens vitrine : --neutral-colors--100 / --main-font */
        background: #030303;
        color: #fff;
        font-family: 'Inter Tight', 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        transition: opacity 0.22s ease;
      }
      #megga-boot { display: none; }
      .megga-booting #megga-boot { display: flex; }
      .megga-boot.is-done { opacity: 0; pointer-events: none; }

      /* Halo bas — le dégradé du pied de page vitrine (`.colors-gradient-bottom`),
         mêmes règles : 422 px collés en bas, `cover`, ancré à 50% 0.
         L'asset est le PNG de la vitrine COPIÉ TEL QUEL (3159x633, 287 Ko,
         somme de contrôle identique à sites/megga-vitrine/images/6704750aa4d…png).

         ⚠ Ne pas « optimiser » en réduisant sa définition. Tentative précédente :
         600 px de large / WebP q85 (22 Ko), retirée parce qu'elle rendait mal.
         `cover` est contraint par la HAUTEUR de la boîte, pas par sa largeur :
         422 px CSS = 844 px écran en Retina, donc une source de 120 px de haut
         est étirée x7 — alors que les 633 px natifs ne le sont que x1,33.
         Le poids paraît élevé pour une décoration, mais il ne retarde rien :
         c'est une image de fond, l'écran peint sans elle et elle arrive après. */
      .megga-boot__glow {
        position: absolute;
        inset: auto 0 0;
        z-index: 0;
        /* 422 px = la valeur vitrine, tenue sur tout écran d'au moins ~810 px de
           haut. En dessous (fenêtre réduite, mobile paysage) le halo noierait
           l'écran au lieu d'en border le bas : on le laisse suivre la hauteur. */
        height: min(422px, 52vh);
        background-image: url('/megga-boot-glow.png');
        background-position: 50% 0;
        background-repeat: no-repeat;
        background-size: cover;
        /* Un peu plus lente et décalée que le logo : le halo s'installe derrière
           lui, et le fondu masque l'arrivée tardive de l'image. */
        animation: megga-boot-in 0.7s ease 0.15s both;
      }
      /* Le halo est positionné, donc il peindrait PAR-DESSUS le contenu en flux
         sur un écran court. On repasse le contenu au-dessus. */
      .megga-boot > :not(.megga-boot__glow) {
        position: relative;
        z-index: 1;
      }

      .megga-boot__logo {
        width: 132px;
        height: auto;
        fill: currentColor;
        animation: megga-boot-in 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }

      .megga-boot__bar {
        position: relative;
        overflow: hidden;
        width: 148px;
        height: 2px;
        margin-top: 30px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.1);
      }
      .megga-boot__bar::after {
        content: '';
        position: absolute;
        inset: 0 auto 0 0;
        width: 40%;
        border-radius: 2px;
        background: #424bfb; /* vitrine --primary-colors--100 */
        animation: megga-boot-run 1.15s ease-in-out infinite;
      }

      .megga-boot__hint {
        margin: 18px 0 0;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.01em;
        color: #686868; /* vitrine --neutral-colors--500 */
        /* Retardée : une connexion rapide passe sans texte clignotant, une lente
           dit à l'agent ce qui se passe. */
        animation: megga-boot-in 0.4s ease 0.9s both;
      }

      @keyframes megga-boot-in {
        from { opacity: 0; transform: translateY(6px); }
        to   { opacity: 1; transform: none; }
      }
      @keyframes megga-boot-run {
        from { transform: translateX(-100%); }
        to   { transform: translateX(250%); }
      }

      @media (prefers-reduced-motion: reduce) {
        .megga-boot__logo,
        .megga-boot__hint { animation: none; }
        .megga-boot__bar::after { width: 100%; opacity: 0.55; animation: none; }
      }
    </style>
  </head>
  <body>
    <!-- Google Tag Manager (noscript) — ne peut PAS être filtré par chemin : il part
         justement quand JS est coupé. Sa `src` ne porte que l'identifiant du conteneur,
         donc le seul canal qui pourrait emporter le token est l'en-tête Referer :
         `referrerpolicy="no-referrer"` le supprime, sans dépendre de la politique par
         défaut du navigateur ni d'un futur <meta name="referrer">. -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-TFVCHXFJ"
    referrerpolicy="no-referrer" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <div id="root"></div>
    <!-- Placé APRÈS #root : à z-index égal, l'ordre du DOM décide, donc l'écran
         d'arrivée reste au-dessus du jumeau React jusqu'à son effacement.
         Logo = public/megga-wordmark.svg (source de vérité), inline ici pour
         éviter une requête réseau avant la première frame. -->
    <div id="megga-boot" class="megga-boot" role="status" aria-live="polite">
      <div class="megga-boot__glow"></div>
      <svg class="megga-boot__logo" viewBox="0 0 1920 419" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
        <polygon points="92 0 237.62 219.08 384 0 475 0 475.31 63.04 363.87 229.77 237.7 418.79 104.93 220.12 104.62 419 0 419 0 0 92 0"></polygon>
        <polygon points="826 0 826.06 94.73 622.1 94.74 621.94 167.65 791.33 167.66 791.33 251.37 622.01 251.37 621.99 324.3 826.05 324.29 825.97 419 517.35 419 517 0 826 0"></polygon>
        <path d="M1052,0c46.64,5.38,88.55,22.94,122.21,59.67-22.79,28.12-37.71,60.3-47.08,96.28-7.89-14.68-16.56-27.02-28.35-37.25-40.39-35.04-99.55-30.53-134.81,9.66-40.25,45.89-40.1,117.16.48,162.82,35.48,39.93,94.73,44.05,134.83,8.67,14.5-12.89,25.12-28.95,32.24-48.42l-95.26-.1-.03-83.65,192.78-.02c8.8,28.23,5.09,73.7-2.86,101.4-22.71,79.15-85.98,140.1-169.06,149-2.17.23-4.11.34-5.1.93h-31c-42.03-4.33-81.34-20.79-113.04-49.92-96.69-88.85-90.73-249.43,12.42-329.58,29.62-23.01,64.08-35.58,100.62-39.5h31Z"></path>
        <path d="M1732,0l188,418.23v.77h-104.98l-42.28-94.7h-124.31s-42.38,94.7-42.38,94.7h-104.22c.24-1.34.57-2.95,1.41-4.82L1690,0h42ZM1739.67,250.92l-29.06-64.46-29.15,64.86,58.21-.39Z"></path>
        <path d="M1351,419h-29c-47.56,0-91.35-24.53-123.87-60,24.65-30.5,36.53-57.89,47.2-96.18,7.43,14.3,16.5,27.51,28.71,37.93,36.96,31.55,90.34,30.86,126.22-1.89,13.97-12.75,24.27-28.48,31.18-47.43l-94.84-.08-.05-83.65,192.4-.03c2.59,9.14,3.94,17.82,4.5,27.2,4.34,72.2-25.1,142.48-83.13,186.34-29.43,22.24-63.45,34.03-99.32,37.8Z"></path>
        <path d="M1351,0c43.2,4.34,82.78,21.02,114.61,50.52,6.43,5.96,12.05,11.43,17.39,19.2l-56.72,84.95c-7.57-14.34-16.16-25.96-27.71-36.03-33.9-29.56-83.44-31.58-119.35-4.39-12.97,9.71-22.64,21.92-30.74,35.77l-101.14-.14c10.87-40.77,32.85-75.32,63.12-102.25,31.59-28.19,70.35-43.46,111.55-47.62h29Z"></path>
        <polygon points="475.11 419 370.91 419 370.69 251.26 475.21 95.29 475.11 419"></polygon>
      </svg>
      <div class="megga-boot__bar"></div>
      <p class="megga-boot__hint">Ouverture de votre espace</p>
    </div>
    <script>
      // Effacement de l'écran d'arrivée dès que React a peint quelque chose.
      // Le signal est volontairement GÉNÉRIQUE (première mutation de #root) et
      // non « le dashboard est prêt » : le jumeau React prend le relais au pixel
      // près, donc l'agent ne voit pas la bascule, et aucun chemin (redirection
      // OAuth agenda, portail vendeur, erreur de chunk) ne peut laisser l'écran figé.
      (function () {
        var boot = document.getElementById('megga-boot');
        var root = document.getElementById('root');
        if (!boot || !root) return;
        // Hors trajet CRM (pages publiques claires) : le nœud est déjà masqué en
        // CSS, on le retire pour ne pas laisser traîner un role="status" mort.
        if (!document.documentElement.classList.contains('megga-booting')) {
          boot.remove();
          return;
        }

        var done = false;
        function dismiss() {
          if (done) return;
          done = true;
          observer.disconnect();
          clearTimeout(safety);
          boot.classList.add('is-done');
          setTimeout(function () { boot.remove(); }, 260);
        }

        // Filet de sécurité : un bundle qui ne boote jamais (chunk 404, JS coupé)
        // ne doit pas laisser l'agent devant un écran d'attente éternel.
        // Armé AVANT le premier dismiss() possible, sinon on laisse traîner un
        // timer de 15 s après un effacement immédiat.
        var safety = setTimeout(dismiss, 15000);

        var observer = new MutationObserver(function () {
          if (root.firstChild) dismiss();
        });
        observer.observe(root, { childList: true });
        if (root.firstChild) dismiss();
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>

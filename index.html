<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Indexable par les moteurs de recherche. Les pages sensibles (dashboard
         agent, /portail vendeur, /admin) bloquent l'indexation via robots.txt
         + meta robots conditionnels côté composant. -->
    <meta name="robots" content="index, follow" />
    <meta name="description" content="Trouvez, louez, estimez votre bien immobilier en Suisse. Recherche intelligente, conformité intégrée, accompagnement humain." />
    <meta name="theme-color" content="#14161C" />
    <!-- Open Graph pour partage social -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_CH" />
    <meta property="og:site_name" content="MEGGA Real Estate" />
    <meta property="og:title" content="MEGGA Real Estate — Le portail immobilier suisse nouvelle génération" />
    <meta property="og:description" content="Plus de 33'000 biens vérifiés à travers la Suisse. Trouvez votre prochain logement en quelques clics." />
    <meta property="og:url" content="https://megga.ch" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://flatfox.ch" crossorigin />
    <link rel="preconnect" href="https://eayczugyrvmtqnnmvjod.supabase.co" crossorigin />
    <link rel="preconnect" href="https://api.mapbox.com" crossorigin />
    <link rel="preconnect" href="https://accounts.google.com" crossorigin />
    <link rel="dns-prefetch" href="https://flatfox.ch" />
    <link rel="dns-prefetch" href="https://eayczugyrvmtqnnmvjod.supabase.co" />
    <link rel="dns-prefetch" href="https://api.mapbox.com" />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Manrope — experimental Acreon direction on seller portal (MonDossier) -->
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <!-- Fraunces + Geist — Quiet Confidence direction on public home (megga.ch) -->
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,300..700,30..100&family=Geist:wght@300..700&display=swap" rel="stylesheet" />
    <!-- Plus Jakarta Sans — fallback Property X (proche d'Objectivity, géométrie similaire) -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>MEGGA Real Estate — Le portail immobilier suisse nouvelle génération</title>
    <script>
      // Pre-set theme BEFORE React renders to prevent white flash (FOUC)
      // Only apply if user explicitly chose dark (not system preference — public pages stay light)
      (function() {
        try {
          var t = localStorage.getItem('megga-theme');
          if (t === 'dark' && /\/dashboard/.test(location.pathname)) {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

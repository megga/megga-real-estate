name: Backend Integration Tests

# Vitest backend suite: RLS isolation across 7 tables, RPCs, and Edge
# Functions contract tests. Hits a real local Supabase instance spun up
# in CI (Postgres + GoTrue + PostgREST + edge-runtime).
#
# Runs on every PR and every push to main. Independent of the E2E
# workflow (e2e.yml) — different concerns, different failure modes.
#
# Local equivalent:
#   1. supabase start
#   2. npm run test:backend
# (see vitest.backend.config.ts for the full setup notes.)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backend:
    name: Vitest backend (RLS + Edge Functions)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Fixed test-only HMAC secret, available at `supabase start` time so the
      # edge runtime picks it up via config.toml [edge_runtime.secrets].
      # Used by kyc-report-data.spec.ts to sign test tokens.
      # NEVER use this value in production — it is intentionally public.
      MEGGA_MAGIC_LINK_HMAC_SECRET: "test-hmac-secret-for-local-backend-suite-0123456789"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        # ⚠ VERSION ÉPINGLÉE, ET CE N'EST PAS DU ZÈLE. `version: latest` oblige l'action à
        # résoudre la dernière release via l'API GitHub, SANS authentification : sous charge,
        # l'IP partagée des runners atteint la limite et le job meurt AVANT tout travail utile
        # (« Failed to resolve latest Supabase CLI release: rate limit exceeded », suivi de
        # « No such container: supabase_db_… »). Mesuré le 02.08.2026 : TROIS occurrences dans
        # la journée, dont un déploiement de production qu'il a fallu relancer à la main.
        # L'épinglage ne dit donc PAS « cette version-là et pas une autre » : c'est un
        # instantané de `latest`, posé le 02.08.2026 à 2.111.0, et relevé à 2.112.0 le
        # 07.08.2026 pour rejoindre ce que Homebrew sert aux postes de développement — un
        # CLI local plus ancien que celui de la CI monte des images Docker différentes sous
        # `supabase start`, et un test peut alors passer d'un côté et pas de l'autre.
        # ⚠ À faire évoluer À LA MAIN quand `supabase/config.toml` ou `supabase start` l'exigent
        # (l'action n'accepte pas de `token` pour authentifier l'appel, et `supabase` n'est pas
        # une dépendance du dépôt : omettre `version` retomberait sur `latest`).
        uses: supabase/setup-cli@v1
        with:
          version: 2.112.0

      - name: Start Supabase local
        # Excludes services we don't test: Studio (admin UI), Inbucket (mail
        # sink), imgproxy (image transforms), vector (logs ingestor),
        # pg_prove (pgTAP runner — we use Vitest instead).
        # Keeps: db, auth (gotrue), rest (postgrest), edge-runtime, realtime,
        # storage — all touched by at least one spec.
        run: supabase start -x studio,inbucket,imgproxy,vector,pg_prove

      - name: Export Supabase credentials to GITHUB_ENV
        # `supabase status -o env` expose les DEUX formats de cle :
        #   - ANON_KEY / SERVICE_ROLE_KEY     (JWT legacy, eyJ...)
        #   - PUBLISHABLE_KEY / SECRET_KEY    (nouveau, sb_publishable_*/sb_secret_*)
        # PostgREST et createClient acceptent les deux -> les deux premieres
        # variables ci-dessous exportent le NOUVEAU format.
        # Mais une edge function qui compare litteralement son Bearer a
        # Deno.env.get('SUPABASE_SERVICE_ROLE_KEY') ne voit, elle, QUE le JWT legacy :
        # c'est ce que le runtime edge injecte sous ce nom (la cle sb_secret_ y
        # atterrit dans SUPABASE_INTERNAL_SECRET_KEY). Lui envoyer le nouveau format,
        # c'est lui envoyer un credential valide mais different -> 401.
        # D'ou la troisieme variable, lue par les specs qui APPELLENT une telle
        # fonction (tests/backend/agency-verification-run.spec.ts,
        # tests/backend/agency-lab-guard.spec.ts).
        # NB : contrairement a ce que disait ce commentaire, .env.test.local porte le
        # JWT LEGACY dans SUPABASE_TEST_SERVICE_ROLE_KEY -- c'est precisement pourquoi
        # ce trou etait invisible en local et n'echouait qu'en CI.
        run: |
          eval "$(supabase status -o env)"
          {
            echo "SUPABASE_TEST_URL=${API_URL:-http://127.0.0.1:54321}"
            echo "SUPABASE_TEST_ANON_KEY=$PUBLISHABLE_KEY"
            echo "SUPABASE_TEST_SERVICE_ROLE_KEY=$SECRET_KEY"
            echo "SUPABASE_TEST_SERVICE_ROLE_JWT=$SERVICE_ROLE_KEY"
          } >> $GITHUB_ENV
          # MEGGA_MAGIC_LINK_HMAC_SECRET is already in the job env (above),
          # so it is visible to all subsequent steps including npm run test:backend.

      - name: Rejouer les migrations du jour (ce que fait deploy.yml, à chaque push)
        # ⛔ CETTE ÉTAPE EXISTE PARCE QU'UN DÉPLOIEMENT DE PRODUCTION EST MORT SANS ELLE.
        # Le 02.08.2026 à 19:16 UTC : `20260802180000` avait fait passer
        # `admin_set_agency_plan` de `void` à `jsonb`, et `20260802170000` — même journée —
        # la recréait en `void`. Au deuxième déploiement du jour, son rejeu a levé
        # `42P13 cannot change return type of existing function`, `set -e` a coupé l'étape,
        # et NI les migrations suivantes NI les Edge Functions ne sont parties.
        #
        # ⚠ CE QUE LA CI NE POUVAIT PAS VOIR, ET QUI EST TOUT LE SUJET. `supabase start`
        # applique les migrations UNE fois, dans l'ordre, sur une base fraîche : `170000`
        # crée en `void`, `180000` remplace en `jsonb`, aucun conflit. Le conflit n'existe
        # qu'au SECOND passage — exactement ce que fait `deploy.yml`, et rien d'autre au
        # dépôt ne le reproduisait. `check-migration-idempotence.mjs` ne pouvait pas
        # l'attraper non plus : il lit la SYNTAXE (un CREATE est-il gardé ?), pas l'effet
        # d'une migration sur l'état laissé par une autre.
        #
        # On rejoue donc ici la MÊME sélection que deploy.yml — préfixe de date `>= TODAY`
        # en UTC, ordre des noms de fichiers — contre la base locale. Un échec ici est un
        # déploiement qui aurait échoué en production.
        #
        # Sur une journée sans migration nouvelle, la boucle ne sélectionne rien et l'étape
        # passe en silence : c'est voulu, pas un contrôle creux — le jour où elle a quelque
        # chose à dire, elle le dit.
        run: |
          set -euo pipefail
          TODAY=$(date -u +%Y%m%d)
          CONTENEUR=$(docker ps --filter name=supabase_db_ --format '{{.Names}}' | head -1)
          if [ -z "$CONTENEUR" ]; then
            echo "::error::conteneur supabase_db_* introuvable — impossible de rejouer"
            exit 1
          fi
          rejouees=0
          for f in $(ls supabase/migrations/*.sql | sort); do
            base=$(basename "$f")
            if [ "${base:0:8}" -ge "$TODAY" ]; then
              echo "::group::Rejeu $base"
              docker exec -i "$CONTENEUR" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < "$f"
              echo "::endgroup::"
              rejouees=$((rejouees + 1))
            fi
          done
          echo "$rejouees migration(s) du jour rejouée(s) sans erreur."

      - name: Run backend tests
        run: npm run test:backend

      - name: Print Supabase logs on failure
        if: failure()
        run: |
          echo "=== supabase status ==="
          supabase status || true
          echo "=== docker ps ==="
          docker ps || true
          # Les noms de conteneurs dérivent du `project_id` de supabase/config.toml
          # (`supabase_db_zealous-faraday-34b2f5`), PAS du nom du dépôt. Figés à
          # `*_megga-real-estate`, ils ne désignaient rien : `docker logs` échouait, le
          # `|| true` avalait l'échec, et on perdait les logs Postgres au moment précis
          # où on venait les chercher.
          # `docker ps -a` et non `docker ps` : un conteneur MORT est justement le cas où
          # ces logs comptent, et il ne figure plus parmi les vivants.
          CONTENEUR_DB=$(docker ps -a --filter name=supabase_db_ --format '{{.Names}}' | head -1)
          CONTENEUR_AUTH=$(docker ps -a --filter name=supabase_auth_ --format '{{.Names}}' | head -1)
          echo "=== postgres logs (${CONTENEUR_DB:-introuvable}) ==="
          docker logs "${CONTENEUR_DB:-supabase_db_introuvable}" 2>&1 | tail -100 || true
          echo "=== auth logs (${CONTENEUR_AUTH:-introuvable}) ==="
          docker logs "${CONTENEUR_AUTH:-supabase_auth_introuvable}" 2>&1 | tail -50 || true

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup || true

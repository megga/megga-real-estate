name: Migration drift (prod vs dépôt)

# Pourquoi un job PLANIFIÉ et non un check de PR : la dérive ne naît pas d'une
# pull request, elle naît du DÉPLOIEMENT — le date-guard de deploy.yml saute
# toute migration mergée après sa propre date, et ne la rattrape plus jamais.
# Le défaut apparaît donc APRÈS le merge, quand plus personne ne regarde.
# Même cadence et même forme que security-audit.yml.
#
# Il tourne aussi après chaque déploiement de main : c'est le moment exact où
# une migration vient d'être sautée, et où la corriger coûte le moins cher.

on:
  schedule:
    - cron: '13 7 * * 1'   # lundi 07:13 UTC, décalé de l'audit sécurité
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:

jobs:
  drift:
    name: Dérive de schéma
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Le push arrive AVANT que deploy.yml n'ait appliqué les migrations du
      # jour : sans cette pause, le contrôle signalerait comme dérive une
      # migration en cours d'application, et crierait au loup à chaque merge.
      - name: Laisser deploy.yml appliquer les migrations
        if: github.event_name == 'push'
        run: sleep 180

      - name: Comparer le dépôt à la production
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/check-migration-drift.mjs

      # Le contrôle ci-dessus exclut explicitement policies, triggers et GRANT :
      # « leur absence ne se lit pas dans un simple information_schema ». Ce trou
      # a coûté une fuite réelle — `anon` détenait SELECT sur `admin_changelog` en
      # production, sans qu'aucune migration ne l'accorde (droits par défaut de
      # Supabase, jamais révoqués), et sa policy laissait passer les nouveautés
      # publiées.
      #
      # ⚠ `if: always()` : les deux dérives sont indépendantes, et une dérive de
      # schéma ne doit pas masquer une dérive de privilèges. Sans ça, la seconde
      # ne se verrait que les jours où la première est verte.
      - name: Dérive des privilèges (anon sur les tables internes)
        if: always()
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/check-privilege-drift.mjs

      # Troisième dérive, du même genre que les deux précédentes et jusqu'ici sans
      # surveillance : `src/types/database.ts` est auto-généré, et le contrôle voisin
      # compare migrations → base, jamais types → base. Or c'est exactement ce trou qui
      # a laissé TypeScript valider le code contre un schéma disparu en juillet 2026.
      # Ici la moitié PRODUCTION du contrôle (relations vivantes absentes du fichier) ;
      # sa moitié statique tourne sur chaque PR dans unit-tests.yml.
      #
      # ⚠ `if: always()`, même raison que ci-dessus : les trois dérives sont
      # indépendantes, et l'une ne doit pas masquer les autres.
      - name: Dérive du typage (relations vivantes absentes de database.ts)
        if: always()
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/check-types-freshness.mjs

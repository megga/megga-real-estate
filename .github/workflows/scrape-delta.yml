name: 🔄 Scrape Delta — Mise à jour quotidienne market_listings

on:
  schedule:
    # Tous les jours à 6h du matin (heure suisse = 4h UTC)
    - cron: '0 4 * * *'
  workflow_dispatch: # Permet de lancer manuellement depuis GitHub Actions

env:
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

jobs:
  scrape-delta:
    name: Scrape nouveaux biens RealAdvisor
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create .env.local for script
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" > .env.local
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env.local

      - name: Run delta scrape
        run: node scripts/scrape-delta.mjs

      - name: Run quality recalculation on new listings
        run: node scripts/recalculate-quality.mjs
        env:
          # Recalcul uniquement sur les biens avec score 0 (nouveaux)
          START_OFFSET: '0'

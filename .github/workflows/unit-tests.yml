name: Unit Tests (Vitest)

# Fast, isolated frontend unit suite (`vitest run`, jsdom).
# Pure tests — no Supabase, no Docker, no Playwright browsers — so this is the
# quickest signal on a PR and the right place to catch a broken unit test
# (e.g. tests/unit/atelier-map-url.spec.ts, which locks the lng/lat order of
# the Mapbox mini-map, or utils.spec.ts).
#
# Scope is defined by vitest.config.ts: tests/unit/** plus the handful of
# Node-safe supabase/functions/_shared/*.test.ts modules (whatsapp-*, vision,
# kyc-extract, magic-link-token, …). Currently 18 files / 173 tests, ~2s.
#
# Separate from backend.yml (RLS + Edge Functions, needs a local Supabase) and
# e2e.yml (Playwright) — different concerns, different failure modes.
#
# Local equivalent: npm run test:unit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  unit:
    name: Vitest unit (jsdom)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Posé explicitement plutôt que laissé au défaut du runner : l'étape de cache
      # ci-dessous et setup-deno doivent viser le MÊME répertoire, sans quoi le cache
      # est écrit à un endroit et lu à un autre — panne silencieuse, cache toujours froid.
      DENO_DIR: ${{ github.workspace }}/.deno-cache

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        id: deps
        run: npm ci

      - name: Lint prose typography (i18n)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        # Garde-fou « style maison MEGGA » : bloque les tells (— / –) dans l'i18n.
        # Bloquant, comme eslint dans deploy.yml.
        run: npm run lint:prose

      - name: Lint i18n (texte FR en dur — surfaces agent verrouillées)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        # Garde-fou i18n : échoue si du texte FR est réintroduit en dur sur une
        # surface agent migrée (règle no-literal-string en ERROR). Cible la règle
        # seule, ce qui donne un échec lisible sur ce seul motif ; le lint complet
        # est de toute façon bloquant dans deploy.yml depuis la PR #981.
        run: npm run lint:i18n

      - name: i18n key parity (FR↔EN)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        # Garde-fou i18n : échoue si une clé FR n'a pas sa contrepartie EN (ou inverse).
        run: npm run i18n:parity:ci

      - name: i18n translation coverage (DE/IT — cliquet)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        # La parité ci-dessus ne voit que la PRÉSENCE des clés : une clé recopiée
        # mot pour mot depuis l'anglais la satisfait. C'est ainsi que 59 % du DE
        # est resté anglais sans qu'aucun signal ne le dise (constat du 02.08.2026).
        # Cliquet, pas seuil : vert à l'état courant, rouge seulement si un commit
        # AJOUTE de l'anglais non traduit. Traduire fait baisser le compteur ;
        # `npm run i18n:coverage:update` verrouille le gain après un lot.
        run: npm run i18n:coverage:ci

      - name: Dead exports (ts-prune)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        # Garde-fou code mort : échoue si un export n'est importé nulle part.
        # Baseline nettoyée (PR #848). Allowlist des gardes intentionnels dans le script.
        run: npm run lint:deadcode

      - name: Dépendances orphelines (installées, jamais importées)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        # Angle mort complémentaire du précédent : `lint:deadcode` raisonne sur les
        # EXPORTS du dépôt, jamais sur ce qu'il INSTALLE. `fuse.js` est ainsi resté
        # en `dependencies` du 20 juillet au 17 août 2026, son dernier import parti
        # avec la SPA d'aide — invisible pour tsc, ESLint et ts-prune à la fois.
        run: npm run lint:deps

      - name: Typage Supabase (client casté / RPC hors types)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        # Garde-fou typage : `src/types/database.ts` est auto-généré et RIEN ne
        # surveillait sa fraîcheur — le dépôt a déjà payé ce défaut en juillet 2026
        # (quatre gestes du pipeline cassés une semaine, cf. l'en-tête de
        # check-migration-drift.mjs). Mesuré le 01.08 : 15 relations et 64 fonctions
        # manquaient, et 16 sites castaient le client pour compiler quand même.
        # Ici, contrôles STATIQUES seuls (aucun secret) ; la comparaison à la
        # production vit dans migration-drift.yml, le seul workflow qui l'interroge.
        run: npm run lint:types-freshness

      - name: Roster edge functions (dérive tree ↔ monitoring)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        # Garde-fou monitoring : src/lib/edgeFunctionRoster.ts est GÉNÉRÉ depuis
        # supabase/functions/ ; échoue si une fonction est ajoutée/retirée sans
        # régénérer (node scripts/check-edge-roster.mjs --write).
        run: npm run lint:roster

      - name: Migrations rejouables (idempotence)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        # Garde-fou déploiement : deploy.yml rejoue TOUTE migration dont le stamp est
        # >= TODAY (UTC), donc une migration mergée le jour de sa date est ré-appliquée
        # à chaque push. Non idempotente, elle casse l'étape « Apply Supabase migrations »
        # et BLOQUE le déploiement des edge functions pour la journée — en imputant la
        # panne à la PR suivante, souvent sans rapport (incident du 19 juil. 2026, #889
        # détecté sur #893, corrigé par #894). Allowlist historique dans le script.
        run: npm run lint:migrations

      - name: Chemin sortant WhatsApp (garde de consentement)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        # Garde-fou CONFORMITÉ : rien ne part vers une personne sans passer par
        # `sendOutboundGuarded`. Un grep de symboles ne suffisait pas — les trois trous les
        # plus graves du chantier passaient par le BON symbole avec un MAUVAIS argument
        # (`kind:'phone'` qui désactivait le registre, un `to_phone` libre jamais vérifié,
        # un accusé qui construisait encore sa requête à la main). On vérifie donc les
        # ARGUMENTS et les LIEUX : finalité lisible statiquement, `lpd_notice` et
        # `opt_out_ack` géographiquement bornés, aucun `buildSend*Request` hors gateway/garde.
        run: npm run lint:whatsapp-outbound

      - name: Blocs SQL des specs backend (équilibre begin/end)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        # Garde-fou ANTI-TEST-CREUX : un corps `do $$ … $$` mal fermé lève `syntax error`,
        # ce qui fait échouer N'IMPORTE QUEL SQL — donc PASSER toute assertion qui se
        # contente d'attendre un échec. Quinze refus du banc de consentement étaient verts
        # et ne prouvaient rien. libpg-query ne peut PAS l'attraper : le corps d'un `do $$`
        # est un littéral pour le parser de PostgreSQL, qui accepte `begin … end end`.
        run: npm run lint:spec-sql

      - name: Gardes d'authentification des edge functions
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        # Toutes les fonctions sont déployées --no-verify-jwt (allowlist JWT_PROTECTED
        # volontairement vide) : la passerelle ne vérifie AUCUNE signature, donc une
        # fonction sans garde est un endpoint public. L'audit du 02.08.2026 a trouvé
        # onze fonctions exploitables, dont trois simplement parce que personne
        # n'avait écrit de garde et que rien ne le signalait — lint:roster contrôle
        # que config.toml DÉCLARE les fonctions, pas qu'elles s'authentifient.
        # ⚠ Cette porte attrape l'oubli TOTAL, pas l'IDOR : deux des onze failles
        # avaient une garde et fuyaient quand même faute de cloisonner par agency_id.
        run: npm run lint:edge-auth

      - name: Coquille des e-mails (direction MEGGA X)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        # ⚠ La garde ci-dessus MANQUAIT — seule des vingt étapes, relevé le 17.08.2026.
        # Sans `if`, GitHub Actions saute une étape dès qu'une précédente a échoué : cette
        # porte ne tournait donc PAS les jours où la CI était déjà rouge, et son absence se
        # lisait « skipped » plutôt que « manquante ». Reste du défaut corrigé partout
        # ailleurs (cf. les autres étapes) ; elle y a échappé pour avoir été ajoutée après.
        #
        # Mesuré le 15.08.2026 : TREIZE fichiers fabriquaient chacun leur propre
        # `<!DOCTYPE html>`, onze en police système, huit fonds de page différents.
        # ⚠ Un module partagé ne suffit pas, on l'a déjà vérifié ici : `_shared/resend.ts`
        # existe pour être le point d'envoi unique et deux sites sur seize l'utilisent.
        # C'est cette porte qui empêche le quatorzième design de naître — la liste
        # A_MIGRER, elle, ne fait que dater les douze qui restent.
        run: npm run lint:email-shell

      - name: Fraîcheur de CLAUDE.md (prétentions chiffrées)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        # Garde-fou de la RÉFÉRENCE elle-même. Le 16.08.2026, sur les sept règles
        # visuelles du §3, UNE SEULE était encore vraie : les six autres décrivaient
        # Sugar Pure, direction supprimée six jours plus tôt.
        #
        # ⛔ C'est la seule porte de ce fichier qui protège un document plutôt que du
        # code, et c'est justement ce qui la rend nécessaire : CLAUDE.md est ce qu'un
        # agent lit AVANT d'écrire. Une règle fausse n'y dort pas, elle se recopie sur
        # chaque surface neuve — l'erreur se propage par la main de ses lecteurs.
        #
        # Deux natures d'échec, deux gestes OPPOSÉS (le rapport le dit à l'écran) :
        # `dur` = le code a régressé, on corrige le code ; `derive` = le doc est périmé,
        # on corrige la prose puis `npm run lint:claude-md:update`. Confondre les deux
        # inscrirait le défaut dans la référence.
        #
        # ⚠ Cette porte peut rougir sur une PR SANS RAPPORT : les décomptes d'usages
        # dérivent avec les merges des autres. Les tolérances sont calibrées pour que
        # ça reste rare ; si ça devient bruyant, élargir la tolérance de la prétention
        # en cause (une ligne dans le registre) plutôt que de désactiver l'étape.
        run: npm run lint:claude-md

      - name: Cache des dépendances Deno
        # Les Edge Functions importent 143 fois par URL (esm.sh, deno.land) ; sans cache,
        # chaque exécution retélécharge tout et met la CI à la merci d'un CDN tiers. Le
        # 02.08.2026, esm.sh a renvoyé des 522 par intermittence et fait rougir trois jobs
        # sans aucun rapport avec le code poussé.
        #
        # ⚠ `restore-keys` n'est PAS décoratif, et c'est la différence avec le bloc de cache
        # des navigateurs Playwright (e2e.yml) dont ce motif s'inspire : la clé exacte
        # change dès qu'un fichier d'edge function bouge, donc sans repli par préfixe le
        # cache serait froid à presque chaque exécution — c'est-à-dire inutile.
        #
        # Ce cache RARÉFIE la dépendance, il ne la supprime pas : cache froid (première
        # exécution, éviction après 7 jours, dépassement du quota) = exposition entière.
        # Le correctif de fond est ailleurs (voir docs/ci-dependance-cdn.md).
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        uses: actions/cache@v4
        with:
          path: ${{ env.DENO_DIR }}
          key: deno-${{ runner.os }}-${{ hashFiles('supabase/functions/**/*.ts') }}
          restore-keys: |
            deno-${{ runner.os }}-

      - name: Setup Deno
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        # Edge Functions (supabase/functions/**) tournent sur Deno, pas Node : elles
        # échappent à tsc (exclu du build front) et à vitest (imports https: non résolus).
        # Épinglé 2.x, aligné sur supabase/config.toml (deno_version = 2).
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check Edge Functions (deno check)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        # Garde-fou backend : `deno check` sur toutes les Edge Functions hors *.test.ts.
        # Seul filet de type sur le code Deno → BLOQUANT (jamais `|| true`).
        # mapfile + find -print0 : robuste aux espaces/caractères spéciaux (bash 5 sur ubuntu).
        run: |
          mapfile -d '' files < <(find supabase/functions -name '*.ts' ! -name '*.test.ts' -print0)
          echo "Type-checking ${#files[@]} Edge Function files…"
          deno check --no-lock "${files[@]}"

      - name: Run unit tests
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        # No --coverage: keep this step fast (it is the PR's quickest check).
        run: npm run test:unit

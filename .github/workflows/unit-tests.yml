name: Unit Tests (Vitest)

# Fast, isolated frontend unit suite (`vitest run`, jsdom).
# Pure tests — no Supabase, no Docker, no Playwright browsers — so this is the
# quickest signal on a PR and the right place to catch a broken unit test
# (e.g. tests/unit/atelier-map-url.spec.ts, which locks the lng/lat order of
# the Mapbox mini-map, or utils.spec.ts).
#
# Scope is defined by vitest.config.ts: tests/unit/** plus the handful of
# Node-safe supabase/functions/_shared/*.test.ts modules (whatsapp-*, vision,
# kyc-extract, magic-link-token, …). Currently 18 files / 173 tests, ~2s.
#
# Separate from backend.yml (RLS + Edge Functions, needs a local Supabase) and
# e2e.yml (Playwright) — different concerns, different failure modes.
#
# Local equivalent: npm run test:unit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  unit:
    name: Vitest unit (jsdom)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint prose typography (i18n)
        # Garde-fou « style maison MEGGA » : bloque les tells (— / –) dans l'i18n.
        # Bloquant, comme eslint dans deploy.yml.
        run: npm run lint:prose

      - name: Lint i18n (texte FR en dur — surfaces agent verrouillées)
        # Garde-fou i18n : échoue si du texte FR est réintroduit en dur sur une
        # surface agent migrée (règle no-literal-string en ERROR). Cible la règle
        # seule, ce qui donne un échec lisible sur ce seul motif ; le lint complet
        # est de toute façon bloquant dans deploy.yml depuis la PR #981.
        run: npm run lint:i18n

      - name: i18n key parity (FR↔EN)
        # Garde-fou i18n : échoue si une clé FR n'a pas sa contrepartie EN (ou inverse).
        run: npm run i18n:parity:ci

      - name: Dead exports (ts-prune)
        # Garde-fou code mort : échoue si un export n'est importé nulle part.
        # Baseline nettoyée (PR #848). Allowlist des gardes intentionnels dans le script.
        run: npm run lint:deadcode

      - name: Typage Supabase (client casté / RPC hors types)
        # Garde-fou typage : `src/types/database.ts` est auto-généré et RIEN ne
        # surveillait sa fraîcheur — le dépôt a déjà payé ce défaut en juillet 2026
        # (quatre gestes du pipeline cassés une semaine, cf. l'en-tête de
        # check-migration-drift.mjs). Mesuré le 01.08 : 15 relations et 64 fonctions
        # manquaient, et 16 sites castaient le client pour compiler quand même.
        # Ici, contrôles STATIQUES seuls (aucun secret) ; la comparaison à la
        # production vit dans migration-drift.yml, le seul workflow qui l'interroge.
        run: npm run lint:types-freshness

      - name: Roster edge functions (dérive tree ↔ monitoring)
        # Garde-fou monitoring : src/lib/edgeFunctionRoster.ts est GÉNÉRÉ depuis
        # supabase/functions/ ; échoue si une fonction est ajoutée/retirée sans
        # régénérer (node scripts/check-edge-roster.mjs --write).
        run: npm run lint:roster

      - name: Migrations rejouables (idempotence)
        # Garde-fou déploiement : deploy.yml rejoue TOUTE migration dont le stamp est
        # >= TODAY (UTC), donc une migration mergée le jour de sa date est ré-appliquée
        # à chaque push. Non idempotente, elle casse l'étape « Apply Supabase migrations »
        # et BLOQUE le déploiement des edge functions pour la journée — en imputant la
        # panne à la PR suivante, souvent sans rapport (incident du 19 juil. 2026, #889
        # détecté sur #893, corrigé par #894). Allowlist historique dans le script.
        run: npm run lint:migrations

      - name: Gardes d'authentification des edge functions
        # Toutes les fonctions sont déployées --no-verify-jwt (allowlist JWT_PROTECTED
        # volontairement vide) : la passerelle ne vérifie AUCUNE signature, donc une
        # fonction sans garde est un endpoint public. L'audit du 02.08.2026 a trouvé
        # onze fonctions exploitables, dont trois simplement parce que personne
        # n'avait écrit de garde et que rien ne le signalait — lint:roster contrôle
        # que config.toml DÉCLARE les fonctions, pas qu'elles s'authentifient.
        # ⚠ Cette porte attrape l'oubli TOTAL, pas l'IDOR : deux des onze failles
        # avaient une garde et fuyaient quand même faute de cloisonner par agency_id.
        run: npm run lint:edge-auth

      - name: Setup Deno
        # Edge Functions (supabase/functions/**) tournent sur Deno, pas Node : elles
        # échappent à tsc (exclu du build front) et à vitest (imports https: non résolus).
        # Épinglé 2.x, aligné sur supabase/config.toml (deno_version = 2).
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check Edge Functions (deno check)
        # Garde-fou backend : `deno check` sur toutes les Edge Functions hors *.test.ts.
        # Seul filet de type sur le code Deno → BLOQUANT (jamais `|| true`).
        # mapfile + find -print0 : robuste aux espaces/caractères spéciaux (bash 5 sur ubuntu).
        run: |
          mapfile -d '' files < <(find supabase/functions -name '*.ts' ! -name '*.test.ts' -print0)
          echo "Type-checking ${#files[@]} Edge Function files…"
          deno check --no-lock "${files[@]}"

      - name: Run unit tests
        # No --coverage: keep this step fast (it is the PR's quickest check).
        run: npm run test:unit

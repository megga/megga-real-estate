name: Unit Tests (Vitest)

# Fast, isolated frontend unit suite (`vitest run`, jsdom).
# Pure tests — no Supabase, no Docker, no Playwright browsers — so this is the
# quickest signal on a PR and the right place to catch a broken unit test
# (e.g. tests/unit/atelier-map-url.spec.ts, which locks the lng/lat order of
# the Mapbox mini-map, or utils.spec.ts).
#
# Scope is defined by vitest.config.ts: tests/unit/** plus the handful of
# Node-safe supabase/functions/_shared/*.test.ts modules (whatsapp-*, vision,
# kyc-extract, magic-link-token, …). Currently 18 files / 173 tests, ~2s.
#
# Separate from backend.yml (RLS + Edge Functions, needs a local Supabase) and
# e2e.yml (Playwright) — different concerns, different failure modes.
#
# Local equivalent: npm run test:unit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  unit:
    name: Vitest unit (jsdom)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint prose typography (i18n)
        # Garde-fou « style maison MEGGA » : bloque les tells (— / –) dans l'i18n.
        # Bloquant (contrairement à eslint dans deploy.yml qui est en `|| true`).
        run: npm run lint:prose

      - name: Lint i18n (texte FR en dur — surfaces agent verrouillées)
        # Garde-fou i18n : échoue si du texte FR est réintroduit en dur sur une
        # surface agent migrée (règle no-literal-string en ERROR). Cible la règle
        # seule → ignore les ~45 erreurs eslint préexistantes hors-i18n (masquées
        # par `|| true` dans deploy.yml).
        run: npm run lint:i18n

      - name: i18n key parity (FR↔EN)
        # Garde-fou i18n : échoue si une clé FR n'a pas sa contrepartie EN (ou inverse).
        run: npm run i18n:parity:ci

      - name: Dead exports (ts-prune)
        # Garde-fou code mort : échoue si un export n'est importé nulle part.
        # Baseline nettoyée (PR #848). Allowlist des gardes intentionnels dans le script.
        run: npm run lint:deadcode

      - name: Roster edge functions (dérive tree ↔ monitoring)
        # Garde-fou monitoring : src/lib/edgeFunctionRoster.ts est GÉNÉRÉ depuis
        # supabase/functions/ ; échoue si une fonction est ajoutée/retirée sans
        # régénérer (node scripts/check-edge-roster.mjs --write).
        run: npm run lint:roster

      - name: Setup Deno
        # Edge Functions (supabase/functions/**) tournent sur Deno, pas Node : elles
        # échappent à tsc (exclu du build front) et à vitest (imports https: non résolus).
        # Épinglé 2.x, aligné sur supabase/config.toml (deno_version = 2).
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check Edge Functions (deno check)
        # Garde-fou backend : `deno check` sur toutes les Edge Functions hors *.test.ts.
        # Seul filet de type sur le code Deno → BLOQUANT (jamais `|| true`).
        # mapfile + find -print0 : robuste aux espaces/caractères spéciaux (bash 5 sur ubuntu).
        run: |
          mapfile -d '' files < <(find supabase/functions -name '*.ts' ! -name '*.test.ts' -print0)
          echo "Type-checking ${#files[@]} Edge Function files…"
          deno check --no-lock "${files[@]}"

      - name: Run unit tests
        # No --coverage: keep this step fast (it is the PR's quickest check).
        run: npm run test:unit

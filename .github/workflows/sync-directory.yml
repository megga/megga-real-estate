name: 📋 Sync Directory — Mise à jour hebdomadaire annuaire agents

on:
  schedule:
    # Chaque lundi à 7h du matin (heure suisse = 5h UTC)
    - cron: '0 5 * * 1'
  workflow_dispatch: # Permet de lancer manuellement depuis GitHub Actions

env:
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

jobs:
  sync-directory:
    name: Sync agents & agences (SVIT + SMK + USPI)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create .env.local for script
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" > .env.local
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env.local

      - name: Sync directory data
        run: node scripts/seed-directory.mjs

name: 📋 Sync Directory — Mise à jour quotidienne annuaire agents

on:
  schedule:
    # Tous les jours à 3h07 UTC (= 5h07 Suisse été / 4h07 Suisse hiver)
    # L'offset à :07 évite la contention avec les crons pile sur l'heure
    - cron: '7 3 * * *'
  workflow_dispatch: # Permet de lancer manuellement depuis GitHub Actions

env:
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

jobs:
  sync-directory:
    name: Sync agents & agences (SVIT + SMK + USPI)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create .env.local for script
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" > .env.local
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env.local

      - name: Sync directory data
        run: node scripts/seed-directory.mjs

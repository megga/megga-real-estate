# Retrait manuel d'un secret Edge Functions devenu inutilisé.
#
# Pourquoi un workflow : le jeton de management (SUPABASE_ACCESS_TOKEN) ne vit
# que comme secret GitHub, et le MCP Supabase n'expose aucune gestion de secrets.
# Sans ça, la seule voie est le clic au dashboard — non tracé, non reproductible.
#
# ⚠ Ce workflow ne manipule JAMAIS la valeur d'un secret : il ne lit que les NOMS
# (jq -r '.[].name') et ne les affiche que par nom. Aucune valeur ne transite dans
# les logs GitHub. Retirer un secret ici ne l'INVALIDE PAS chez le fournisseur :
# une clé qui a fui doit être supprimée dans la console du fournisseur.
name: Purge edge secret (manuel)

on:
  workflow_dispatch:
    inputs:
      names:
        description: 'Noms de secrets à retirer, séparés par des virgules (ex: ANTHROPIC_API_KEY)'
        required: true
        type: string
      confirm:
        description: 'Taper SUPPRIMER (en majuscules) pour confirmer'
        required: true
        type: string

env:
  PROJECT_REF: eayczugyrvmtqnnmvjod
  # Secrets vitaux : refus inconditionnel, même si le grep ne les voit pas
  # (certains sont lus par la plateforme ou par des wrappers pg_cron).
  PROTECTED: >-
    DEEPSEEK_API_KEY GEMINI_API_KEY GOOGLE_AI_API_KEY RESEND_API_KEY
    DILISENSE_API_KEY STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET
    MICROSOFT_CLIENT_ID MICROSOFT_CLIENT_SECRET GOOGLE_CLIENT_ID
    GOOGLE_CLIENT_SECRET DEEPGRAM_API_KEY SUPABASE_URL
    SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY SUPABASE_DB_URL

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Garde-fou — confirmation explicite
        run: |
          if [ "${{ inputs.confirm }}" != "SUPPRIMER" ]; then
            echo "::error::Confirmation absente ou incorrecte (attendu : SUPPRIMER). Rien n'a été retiré."
            exit 1
          fi

      # Deux refus :
      #  1. secret de la liste protégée ;
      #  2. secret encore LU par une edge function (Deno.env.get) — le retirer
      #     casserait la fonction au prochain appel. C'est l'analogue du garde-fou
      #     « encore versionnée » de purge-orphan-functions.yml.
      - name: Garde-fou — secrets protégés et secrets encore lus
        run: |
          set -euo pipefail
          IFS=',' read -ra NAMES <<< "${{ inputs.names }}"
          FAIL=0
          for raw in "${NAMES[@]}"; do
            name=$(echo "$raw" | tr -d '[:space:]')
            [ -z "$name" ] && continue
            for p in ${PROTECTED}; do
              if [ "$name" = "$p" ]; then
                echo "::error::'$name' est PROTÉGÉ (vital ou géré par la plateforme). Refus."
                FAIL=1
              fi
            done
            if grep -rq "$name" supabase/functions/ 2>/dev/null; then
              echo "::error::'$name' est encore référencé dans supabase/functions/ — retire d'abord le code qui le lit."
              grep -rn "$name" supabase/functions/ | head -5
              FAIL=1
            fi
          done
          [ "$FAIL" -eq 0 ] || exit 1

      # NOMS UNIQUEMENT : `jq -r '.[].name'` — jamais .value.
      - name: Inventaire avant (noms seuls)
        env:
          SB_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          curl -sS -H "Authorization: Bearer $SB_TOKEN" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/secrets" \
            | jq -r '.[].name' | sort | tee /tmp/before.txt

      - name: Retirer les secrets
        env:
          SB_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          IFS=',' read -ra NAMES <<< "${{ inputs.names }}"
          PAYLOAD=$(printf '%s\n' "${NAMES[@]}" | tr -d '[:space:]' | grep -v '^$' | jq -R . | jq -sc .)
          echo "Retrait demandé pour : $PAYLOAD"
          HTTP=$(curl -sS -o /tmp/resp.txt -w '%{http_code}' -X DELETE \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/secrets" \
            -H "Authorization: Bearer $SB_TOKEN" \
            -H 'Content-Type: application/json' \
            -d "$PAYLOAD")
          echo "HTTP $HTTP"
          if [ "$HTTP" -ge 400 ]; then
            echo "::error::Échec du retrait (HTTP $HTTP)"
            cat /tmp/resp.txt
            exit 1
          fi

      - name: Inventaire après + vérification
        env:
          SB_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          curl -sS -H "Authorization: Bearer $SB_TOKEN" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/secrets" \
            | jq -r '.[].name' | sort | tee /tmp/after.txt
          echo "---- retirés ----"
          comm -23 /tmp/before.txt /tmp/after.txt
          IFS=',' read -ra NAMES <<< "${{ inputs.names }}"
          FAIL=0
          for raw in "${NAMES[@]}"; do
            name=$(echo "$raw" | tr -d '[:space:]')
            [ -z "$name" ] && continue
            if grep -qx "$name" /tmp/after.txt; then
              echo "::error::'$name' est TOUJOURS présent après le retrait"
              FAIL=1
            fi
          done
          [ "$FAIL" -eq 0 ] || exit 1
          echo "✓ retrait confirmé"

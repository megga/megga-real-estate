name: Regenerate Visual Baselines

# Triggered by commenting "/regenerate-visual-baselines" on any pull request.
# Runs the visual regression tests with --update-snapshots, then commits the
# generated baseline images back to the PR branch. After this completes, the
# normal CI run on the PR should turn green.

on:
  issue_comment:
    types: [created]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  generate:
    if: |
      github.event.issue.pull_request != null &&
      contains(github.event.comment.body, '/regenerate-visual-baselines')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    timeout-minutes: 20

    steps:
      - name: Resolve PR branch
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH=$(gh pr view ${{ github.event.issue.number }} --repo ${{ github.repository }} --json headRefName --jq .headRefName)
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.branch }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium with system deps
        run: npx playwright install --with-deps chromium

      - name: Generate baselines (update snapshots)
        # Uses the dedicated playwright.visual.config.ts — the default
        # config testIgnores visual-regression so even pointing at the spec
        # file directly results in "no tests found".
        run: npx playwright test --config=playwright.visual.config.ts --update-snapshots=all

      # ⛔ L'EMPREINTE N'EST PAS ÉCRITE ICI, ET C'EST DÉLIBÉRÉ.
      #
      # Elle rattache la capture aux sources qui la peignent
      # (`tests/unit/visual-baseline-fraicheur.spec.ts`). Une étape ajoutée à ce
      # fichier NE S'EXÉCUTERAIT PAS : pour un événement `issue_comment`, GitHub
      # lit la définition du workflow sur la BRANCHE PAR DÉFAUT, jamais sur la
      # branche de PR — même s'il checkout cette dernière juste après. Mesuré le
      # 15 août 2026 : l'étape ajoutée sur la PR n'apparaît pas dans le journal
      # du run, la capture a été régénérée et l'empreinte est restée périmée.
      #
      # C'est donc `visual-regression.spec.ts` qui l'écrit, sous
      # `--update-snapshots` — la SPEC, elle, vient bien du checkout. Elle
      # atterrit dans le dossier des captures, donc dans le `git add` ci-dessous.
      - name: Commit & push baselines if changed
        run: |
          git config user.name "Claude (visual baselines)"
          git config user.email "noreply@anthropic.com"
          git add tests/e2e/visual-regression.spec.ts-snapshots/
          if git diff --cached --quiet; then
            echo "No baseline changes to commit."
          else
            git commit -m "chore(visual): regenerate baselines via /regenerate-visual-baselines"
            git push
          fi

      - name: React to the triggering comment
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions \
            -X POST -f content=rocket || true

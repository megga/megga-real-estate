name: Intercom content (audit Help Center articles)

# Consomme le secret INTERCOM_ACCESS_TOKEN (write-only côté GitHub : personne ne le
# relit, il est juste injecté ici). Déclenché à la main → on lit le résultat dans les
# logs du run. Sert à auditer l'état des articles Help Center (locale EN vs FR vide).
#   gh workflow run intercom-content.yml -f mode=audit --ref <branche-ou-main>
# Le script n'a aucune dépendance npm (fetch natif Node 22) → pas de `npm ci`.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode du script'
        required: true
        default: 'audit'
        type: choice
        options:
          - audit
          - articles-unpublish-dry
          - articles-unpublish
          - articles-publish
          - articles-promote-dry
          - articles-promote
          - articles-update-dry
          - articles-update
          - attributes-declare
          - migrate-dry
          - migrate
          - migrate-collections
          - delete-demo
          - news-audit
          - news-publish
      unpublish_ids:
        description: >-
          articles-unpublish : IDs à dépublier (CSV). OBLIGATOIRE — ce mode refuse
          de tourner à vide, « tout dépublier » n'étant jamais l'intention.
        required: false
        default: ''
        type: string
      promote_ids:
        description: 'articles-promote : IDs ciblés (CSV, vide = tous les brouillons hors démo)'
        required: false
        default: ''
        type: string

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Les modes news-* ciblent le script News ; les autres le script content.
      - name: Run intercom tooling (${{ inputs.mode }})
        env:
          INTERCOM_ACCESS_TOKEN: ${{ secrets.INTERCOM_ACCESS_TOKEN }}
          MODE: ${{ inputs.mode }}
          PROMOTE_IDS: ${{ inputs.promote_ids }}
          UNPUBLISH_IDS: ${{ inputs.unpublish_ids }}
        run: |
          if [[ "$MODE" == news-* ]]; then
            node scripts/intercom-news.mjs "$MODE"
          else
            node scripts/intercom-content.mjs "$MODE"
          fi

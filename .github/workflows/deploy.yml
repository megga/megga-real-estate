name: Deploy to Cloudflare Pages + Supabase Edge Functions

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Opt into Node.js 24 for action runners to silence the deprecation
# warnings and avoid the forced migration on June 2nd 2026.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc -b

      - name: Lint
        # Warnings are OK (react-hooks/preserve-manual-memoization etc.)
        # Only fail on actual errors (exit code from eslint is 1 only for errors, not warnings)
        run: npm run lint || true

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}
          # Sentry source maps upload — no-op si le secret est absent
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Setup Supabase CLI
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # Apply Postgres migrations through the Supabase Management API
      # rather than psql or `supabase db push`:
      #   - psql to the pooler at :5432 fails with "connection refused"
      #     (session pooler is not exposed there), and :6543 wraps every
      #     statement in a transaction — fine for our DDL but flaky for
      #     larger migrations.
      #   - `supabase db push` trips on the schema_migrations log because
      #     several past migrations were applied via the SQL editor and
      #     never tracked there.
      # The Management API runs each request as a single SQL execution
      # against the database with full privileges, exactly like the SQL
      # editor in Studio. It uses HTTPS so no DB ports needed.
      #
      # Each migration file is expected to be idempotent (IF NOT EXISTS /
      # OR REPLACE), so replaying today's files is safe. We filter by
      # filename prefix so older files are not replayed.
      - name: Apply Supabase migrations (Management API)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SB_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -e
          TODAY=$(date -u +%Y%m%d)
          PROJECT_REF=eayczugyrvmtqnnmvjod
          shopt -s nullglob

          # Retry up to 3 times on 5xx (transient Management API hiccup —
          # we hit one of those on 2026-05-18 mid-deploy). 4xx is a real
          # SQL error and fails fast. Backoff: 2s, 4s.
          apply_migration() {
            local f="$1"
            local base
            base=$(basename "$f")
            local body
            body=$(jq -Rs '{query: .}' < "$f")
            local attempt=1
            while [ $attempt -le 3 ]; do
              local http
              http=$(curl -sS -o /tmp/sb_resp.json -w '%{http_code}' \
                -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
                -H "Authorization: Bearer $SB_TOKEN" \
                -H "Content-Type: application/json" \
                -d "$body")
              echo "HTTP $http (attempt $attempt/3)"
              cat /tmp/sb_resp.json
              echo
              if [ "$http" -lt 400 ]; then
                return 0
              fi
              if [ "$http" -ge 500 ] && [ $attempt -lt 3 ]; then
                local delay=$((attempt * 2))
                echo "::warning::Migration $base got HTTP $http — retrying in ${delay}s"
                sleep "$delay"
                attempt=$((attempt + 1))
                continue
              fi
              echo "::error::Migration $base failed (HTTP $http)"
              return 1
            done
            return 1
          }

          for f in $(ls supabase/migrations/*.sql | sort); do
            base=$(basename "$f")
            stamp="${base%%_*}"
            if [ "$stamp" -ge "$TODAY" ]; then
              echo "::group::Applying $base"
              apply_migration "$f"
              echo "::endgroup::"
            fi
          done

      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # `--commit-message="deploy <sha>"` court-circuite l'introspection
          # git de wrangler. Sans ça, wrangler pousse le message du HEAD vers
          # l'API Cloudflare, qui a un validateur UTF-8 strict bogué : il
          # rejette certaines séquences Unicode pourtant valides (constaté
          # 2026-05-18 sur un message contenant em-dashes + arrows + accents).
          # Avec un SHA pur ASCII on évite définitivement ce mode de panne.
          # `--commit-dirty=true` silence le warning "uncommitted changes" lié
          # au dist/ buildé localement. NOTE : tout sur une seule ligne — les
          # backslashes de continuation bash ne sont pas interprétés dans un
          # YAML block scalar et wrangler les recevrait comme args littéraux.
          command: pages deploy dist --project-name=megga-real-estate --commit-message="deploy ${{ github.sha }}" --commit-dirty=true

      - name: Link Supabase project and deploy functions
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        # Tolère les échecs individuels : si une fonction plante (import
        # deno cassé, secret manquant, etc.), on log et on continue les
        # autres. Le step ne fail que si AUCUNE fonction n'a été déployée.
        run: |
          set +e  # Désactive fail-fast pour la boucle

          supabase link --project-ref eayczugyrvmtqnnmvjod
          LINK_RC=$?
          if [ $LINK_RC -ne 0 ]; then
            echo "::error::supabase link failed (rc=$LINK_RC) — aborting"
            exit $LINK_RC
          fi

          SUCCESS=0
          FAILED=0
          FAILED_FNS=""

          for fn_dir in supabase/functions/*/; do
            fn_name=$(basename "$fn_dir")
            if [ -f "$fn_dir/index.ts" ]; then
              echo "::group::Deploying $fn_name"
              supabase functions deploy "$fn_name" --no-verify-jwt
              RC=$?
              echo "::endgroup::"
              if [ $RC -eq 0 ]; then
                SUCCESS=$((SUCCESS + 1))
              else
                FAILED=$((FAILED + 1))
                FAILED_FNS="$FAILED_FNS $fn_name"
                echo "::warning::Deployment of $fn_name failed (rc=$RC) — continuing"
              fi
            fi
          done

          echo ""
          echo "═══ Summary ═══"
          echo "  ✅ Deployed : $SUCCESS"
          echo "  ❌ Failed   : $FAILED"
          if [ $FAILED -gt 0 ]; then
            echo "  Failed functions:$FAILED_FNS"
          fi

          # Ne fail le step que si TOUTES les fonctions plantent
          if [ $SUCCESS -eq 0 ] && [ $FAILED -gt 0 ]; then
            echo "::error::All edge function deployments failed"
            exit 1
          fi
          exit 0
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

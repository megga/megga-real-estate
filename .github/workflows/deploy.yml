name: Deploy to Cloudflare Pages + Supabase Edge Functions

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=megga-real-estate

      - name: Deploy Supabase Edge Functions
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project and deploy functions
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          supabase link --project-ref eayczugyrvmtqnnmvjod
          for fn_dir in supabase/functions/*/; do
            fn_name=$(basename "$fn_dir")
            if [ -f "$fn_dir/index.ts" ]; then
              echo "Deploying $fn_name..."
              supabase functions deploy "$fn_name" --no-verify-jwt
            fi
          done
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

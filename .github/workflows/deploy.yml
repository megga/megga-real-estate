name: Deploy to Cloudflare Pages + Supabase Edge Functions

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Opt into Node.js 24 for action runners to silence the deprecation
# warnings and avoid the forced migration on June 2nd 2026.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc -b

      - name: Lint
        # Warnings are OK (react-hooks/preserve-manual-memoization etc.)
        # Only fail on actual errors (exit code from eslint is 1 only for errors, not warnings)
        run: npm run lint || true

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}

      - name: Setup Supabase CLI
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # Apply Postgres migrations directly via psql instead of
      # `supabase db push`. The CLI compares local migrations to the remote
      # `supabase_migrations.schema_migrations` log and tries to apply
      # anything missing — but several historical migrations were applied
      # manually via the SQL editor and never recorded in that table, so
      # `db push` keeps tripping on objects that already exist.
      #
      # Strategy:
      #   - Each migration file is idempotent (IF NOT EXISTS / OR REPLACE),
      #     so running them every time is safe.
      #   - We connect through the Supabase pooler in session mode (port
      #     5432) which accepts both IPv4 (GitHub runners) and statements
      #     incompatible with the transaction pooler (ALTER FUNCTION etc.).
      #   - Only files newer than the last successfully applied one are
      #     replayed — checked by listing local migrations sorted lex and
      #     applying each in order with ON_ERROR_STOP. A duplicate object
      #     fails the run loudly so we notice; that's by design.
      - name: Apply Supabase migrations (psql)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -e
          # Apply only migrations dated today or later — the catalog of
          # past migrations is assumed to be already in production. Using
          # `find` with -newer would be fragile in CI, so we filter by
          # filename prefix instead.
          TODAY=$(date -u +%Y%m%d)
          DB_URL="postgresql://postgres.eayczugyrvmtqnnmvjod@aws-0-eu-west-1.pooler.supabase.com:5432/postgres?sslmode=require"
          shopt -s nullglob
          for f in $(ls supabase/migrations/*.sql | sort); do
            base=$(basename "$f")
            stamp="${base%%_*}"
            if [ "$stamp" -ge "$TODAY" ]; then
              echo "::group::Applying $base"
              psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$f"
              echo "::endgroup::"
            fi
          done

      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=megga-real-estate

      - name: Link Supabase project and deploy functions
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        # Tolère les échecs individuels : si une fonction plante (import
        # deno cassé, secret manquant, etc.), on log et on continue les
        # autres. Le step ne fail que si AUCUNE fonction n'a été déployée.
        run: |
          set +e  # Désactive fail-fast pour la boucle

          supabase link --project-ref eayczugyrvmtqnnmvjod
          LINK_RC=$?
          if [ $LINK_RC -ne 0 ]; then
            echo "::error::supabase link failed (rc=$LINK_RC) — aborting"
            exit $LINK_RC
          fi

          SUCCESS=0
          FAILED=0
          FAILED_FNS=""

          for fn_dir in supabase/functions/*/; do
            fn_name=$(basename "$fn_dir")
            if [ -f "$fn_dir/index.ts" ]; then
              echo "::group::Deploying $fn_name"
              supabase functions deploy "$fn_name" --no-verify-jwt
              RC=$?
              echo "::endgroup::"
              if [ $RC -eq 0 ]; then
                SUCCESS=$((SUCCESS + 1))
              else
                FAILED=$((FAILED + 1))
                FAILED_FNS="$FAILED_FNS $fn_name"
                echo "::warning::Deployment of $fn_name failed (rc=$RC) — continuing"
              fi
            fi
          done

          echo ""
          echo "═══ Summary ═══"
          echo "  ✅ Deployed : $SUCCESS"
          echo "  ❌ Failed   : $FAILED"
          if [ $FAILED -gt 0 ]; then
            echo "  Failed functions:$FAILED_FNS"
          fi

          # Ne fail le step que si TOUTES les fonctions plantent
          if [ $SUCCESS -eq 0 ] && [ $FAILED -gt 0 ]; then
            echo "::error::All edge function deployments failed"
            exit 1
          fi
          exit 0
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

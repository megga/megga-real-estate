name: Deploy to Cloudflare Pages + Supabase Edge Functions

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual trigger to re-deploy main on demand — recover a stuck or raced
  # deploy without having to push an empty commit.
  #
  # ⚠ Les étapes de déploiement se gardent par `env.DEPLOIE_PROD` (voir plus bas),
  # PAS par `github.event_name == 'push'` : entre l'ajout de ce déclencheur et le
  # 07.08.2026, elles l'étaient, et un run manuel sautait donc tout ce qui compte
  # tout en rendant « success ». Toute nouvelle étape de déploiement doit reprendre
  # `DEPLOIE_PROD`, sinon ce déclencheur redevient décoratif.
  workflow_dispatch:

# Opt into Node.js 24 for action runners to silence the deprecation
# warnings and avoid the forced migration on June 2nd 2026.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

  # Faut-il déployer sur cette exécution ? Vrai pour un push sur main ET pour un
  # workflow_dispatch sur main ; faux pour une PR.
  #
  # POURQUOI UNE CONDITION NOMMÉE PLUTÔT QUE QUATRE COPIES. Les quatre étapes qui
  # déploient réellement (CLI Supabase, migrations, Cloudflare, edge functions)
  # portaient chacune `github.event_name == 'push' && …`, recopié. Le jour où
  # `workflow_dispatch` a été ajouté aux déclencheurs — précisément « pour rejouer un
  # deploy coincé sans pousser un commit vide » — aucune des quatre n'a été mise à
  # jour. Résultat mesuré le 06.08.2026 : un run manuel saute TOUTES les étapes
  # utiles et rend « success » en ~40 s. Vert, et strictement inutile — ce qui est
  # pire qu'un rouge, parce qu'on le lit comme un déploiement réussi. C'est ce qui a
  # fait croire ce soir-là que deux migrations étaient parties en production alors
  # que rien n'avait tourné.
  #
  # Une seule expression, donc, et quatre étapes qui la consomment : une cinquième
  # étape de déploiement ajoutée demain ne peut plus hériter d'une copie périmée.
  DEPLOIE_PROD: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}

# Serialize production deploys. Two pushes to main within seconds (e.g. two PRs
# merged back-to-back) previously launched two concurrent
# `wrangler pages deploy --branch=main` calls that raced: the older artifact
# won and shipped a stale production build (2026-06-03 — the Microsoft-icon fix
# in #551 was clobbered by the immediately-preceding #552 merge's deploy).
# Queueing by group runs the newer commit's deploy AFTER the older one finishes,
# so the latest commit always ends up live. We do NOT cancel in-progress:
# migrations and function deploys must finish cleanly rather than be killed
# mid-flight.
#
# Group is keyed on github.ref so ONLY same-ref runs serialize: every push to
# main (+ workflow_dispatch on main) shares one queue and lines up, while each
# PR / branch gets its own group and never blocks a production deploy.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc -b

      - name: Lint
        # BLOQUANT depuis la PR #981, qui a ramené le lint à 0 erreur. Il était
        # en `|| true` parce que la base traînait 31 erreurs : le garde-fou ne
        # pouvait pas servir tant qu'il était rouge.
        # Les avertissements restent tolérés — `eslint .` ne sort en 1 que sur
        # des ERREURS (pas de --max-warnings), donc les ~131 warnings connus
        # (react-hooks/set-state-in-effect, purity…) ne bloquent pas le déploiement.
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}
          # Sentry source maps upload — no-op si le secret est absent
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          # Centre d'aide de la vitrine : `scripts/vitrine-aide.mjs` lit les
          # articles chez Intercom au postbuild. ⛔ Contrairement aux autres, ce
          # secret n'est PAS optionnel ici — sans lui le générateur SORT EN
          # ERREUR (CI=true), parce qu'un centre d'aide vide publié est pire
          # qu'un déploiement qui s'arrête. En local il écrit une page d'attente.
          # (GitHub Actions pose CI=true de lui-même : c'est ce que lit le script.)
          #
          # ⚠ CE JETON N'EST PAS LE SEUL. Le build git-connecté de Cloudflare
          # Pages construit la MÊME vitrine, et Cloudflare pose `CI=true` aussi :
          # il lui faut donc sa propre copie, déclarée dans Pages → Settings →
          # Variables and Secrets, sur Production ET Preview. Elle vient d'une
          # app Intercom SÉPARÉE (« Cloudflare »), en lecture seule.
          # ⛔ Ne pas supprimer l'app d'origine en la croyant remplacée : c'est
          # ELLE qui porte `Write content data`, donc le mode `articles-unpublish`.
          INTERCOM_ACCESS_TOKEN: ${{ secrets.INTERCOM_ACCESS_TOKEN }}

      # NOTE: the V3 static storefront is overlaid onto dist/ by the npm
      # `postbuild` hook (scripts/overlay-storefront.mjs), so it runs for
      # BOTH this workflow AND the git-connected Cloudflare Pages build.
      # No overlay step is needed here.
      #
      # ⚠ CONSÉQUENCE POUR LE CENTRE D'AIDE : ce même hook lance désormais
      # `vitrine-aide.mjs`, qui SORT EN ERREUR quand `CI` est posé et que
      # `INTERCOM_ACCESS_TOKEN` manque — et Cloudflare pose `CI=true` lui aussi.
      #
      # ✅ MESURÉ sur la PR #1253 (17.08.2026) : le build git-connecté EXISTE
      # bien — il rend le check « Cloudflare Pages », qui a échoué exactement là.
      # ⚠ ET LES DEUX CHEMINS NE FONT PAS LE MÊME TRAVAIL, contrairement à ce
      # qu'on pourrait croire d'un doublon : l'étape wrangler ci-dessous est
      # gardée par `DEPLOIE_PROD` et ne déploie donc QUE sur `main`, tandis que
      # le build git-connecté est le SEUL à produire les prévisualisations de PR.
      # Le débrancher pour « supprimer le doublon » les supprimerait avec.

      - name: Setup Supabase CLI
        if: env.DEPLOIE_PROD == 'true'
        # ⚠ VERSION ÉPINGLÉE, ET CE N'EST PAS DU ZÈLE. `version: latest` oblige l'action à
        # résoudre la dernière release via l'API GitHub, SANS authentification : sous charge,
        # l'IP partagée des runners atteint la limite et le job meurt AVANT tout travail utile
        # (« Failed to resolve latest Supabase CLI release: rate limit exceeded », suivi de
        # « No such container: supabase_db_… »). Mesuré le 02.08.2026 : TROIS occurrences dans
        # la journée, dont un déploiement de production qu'il a fallu relancer à la main.
        # 2.111.0 EST ce que `latest` résolvait ce jour-là — l'épinglage ne change donc aucun
        # comportement, il supprime seulement l'appel réseau.
        # ⚠ À faire évoluer À LA MAIN quand `supabase/config.toml` ou `supabase start` l'exigent
        # (l'action n'accepte pas de `token` pour authentifier l'appel, et `supabase` n'est pas
        # une dépendance du dépôt : omettre `version` retomberait sur `latest`).
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      # Apply Postgres migrations through the Supabase Management API
      # rather than psql or `supabase db push`:
      #   - psql to the pooler at :5432 fails with "connection refused"
      #     (session pooler is not exposed there), and :6543 wraps every
      #     statement in a transaction — fine for our DDL but flaky for
      #     larger migrations.
      #   - `supabase db push` trips on the schema_migrations log because
      #     several past migrations were applied via the SQL editor and
      #     never tracked there.
      # The Management API runs each request as a single SQL execution
      # against the database with full privileges, exactly like the SQL
      # editor in Studio. It uses HTTPS so no DB ports needed.
      #
      # Each migration file is expected to be idempotent (IF NOT EXISTS /
      # OR REPLACE), so replaying today's files is safe. We filter by
      # filename prefix so older files are not replayed.
      - name: Apply Supabase migrations (Management API)
        if: env.DEPLOIE_PROD == 'true'
        env:
          SB_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -e
          # Only re-apply migrations dated today (YYYYMMDD, 8 chars).
          TODAY=$(date -u +%Y%m%d)
          PROJECT_REF=eayczugyrvmtqnnmvjod
          shopt -s nullglob

          # Retry up to 3 times on 5xx (transient Management API hiccup —
          # we hit one of those on 2026-05-18 mid-deploy). 4xx is a real
          # SQL error and fails fast. Backoff: 2s, 4s.
          apply_migration() {
            local f="$1"
            local base
            base=$(basename "$f")
            local body
            body=$(jq -Rs '{query: .}' < "$f")
            local attempt=1
            while [ $attempt -le 3 ]; do
              local http
              http=$(curl -sS -o /tmp/sb_resp.json -w '%{http_code}' \
                -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
                -H "Authorization: Bearer $SB_TOKEN" \
                -H "Content-Type: application/json" \
                -d "$body")
              echo "HTTP $http (attempt $attempt/3)"
              cat /tmp/sb_resp.json
              echo
              if [ "$http" -lt 400 ]; then
                return 0
              fi
              if [ "$http" -ge 500 ] && [ $attempt -lt 3 ]; then
                local delay=$((attempt * 2))
                echo "::warning::Migration $base got HTTP $http — retrying in ${delay}s"
                sleep "$delay"
                attempt=$((attempt + 1))
                continue
              fi
              echo "::error::Migration $base failed (HTTP $http)"
              return 1
            done
            return 1
          }

          for f in $(ls supabase/migrations/*.sql | sort); do
            base=$(basename "$f")
            # Migration filenames use YYYYMMDDHHMMSS (14 chars). Compare only
            # the date portion with TODAY (8 chars). Without this, bash
            # integer comparison treated 20260526140000 (14 digits) as
            # greater than 20260528 (8 digits) → every recent migration was
            # re-applied on every deploy and the first non-idempotent one
            # broke the chain (`CREATE POLICY` without `IF NOT EXISTS`).
            stamp_date="${base:0:8}"
            if [ "$stamp_date" -ge "$TODAY" ]; then
              echo "::group::Applying $base"
              apply_migration "$f"
              echo "::endgroup::"
            fi
          done

      # Contre-mesure au REVERS du filtre ci-dessus. `stamp >= TODAY` a deux faces :
      # il évite de rejouer l'historique (voulu), mais il SAUTE DÉFINITIVEMENT toute
      # migration mergée APRÈS sa propre date — une fois stamp < TODAY, aucun
      # déploiement ultérieur ne la rattrape. Mesuré le 19 juil. 2026 : 19 migrations
      # du dépôt sont dans ce cas. La prod n'a pas dérivé, mais uniquement parce
      # qu'elles avaient été appliquées à la main (MCP apply_migration) avant le
      # merge — c'est la discipline humaine qui tient, pas la CI.
      #
      # Cette étape n'applique jamais rien elle-même : l'application manuelle EST
      # le flux normal du dépôt. Jusqu'ici elle se contentait de rendre l'omission
      # VISIBLE, sans distinguer une migration réellement absente d'une migration
      # déjà appliquée à la main. Depuis le 28 juil. 2026, elle vérifie chaque
      # migration sautée contre supabase_migrations.schema_migrations avant
      # d'avertir : présente dans cette table, elle se tait ; absente, ou
      # vérification impossible, elle avertit comme avant. Elle n'échoue jamais.
      # Pourquoi pas d'échec dur alors que c'était l'objectif initial : voir le
      # raisonnement détaillé juste avant l'appel à l'API, plus bas dans ce step.
      #
      # ⚠ Et elle ne suffit pas, quoi qu'elle vérifie : le 28 juil. 2026, deux
      # migrations du 21 manquaient depuis une semaine (reminders.kind,
      # transactions.archived_at), cassant quatre gestes du pipeline. Cette alerte
      # ne parle que du PUSH COURANT et ne dit rien de l'état réel de la base au
      # fil du temps. Le vrai filet est `migration-drift.yml`
      # (scripts/check-migration-drift.mjs), qui compare ce que le dépôt déclare à
      # ce que la production contient — et qui, lui, échoue.
      # ⚠ SEULE étape qui reste volontairement `push` — ne PAS la basculer sur
      # `DEPLOIE_PROD`. Elle lit les fichiers AJOUTÉS dans la charge utile de
      # l'événement (`.commits[].added[]`), qui n'existe QUE pour un push. Sur un
      # workflow_dispatch la liste serait vide et l'étape conclurait « rien à
      # signaler » — un silence rassurant et faux, exactement ce que son propre
      # commentaire plus bas s'interdit (« une alerte qui échoue en silence ne vaut
      # rien »). Mieux vaut qu'elle ne tourne pas du tout que de mentir.
      - name: Migrations sautées par le date-guard (alerte)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SB_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -e
          TODAY=$(date -u +%Y%m%d)
          PROJECT_REF=eayczugyrvmtqnnmvjod

          # Fichiers AJOUTÉS par ce push, lus dans la charge utile de l'événement :
          # actions/checkout ne clone qu'un commit, donc `git diff` n'a pas
          # l'historique nécessaire. NB : GitHub plafonne `commits` à 20 entrées —
          # au-delà l'alerte peut manquer un fichier ; le cas normal (squash merge)
          # est un commit unique.
          # Une alerte qui echoue en silence ne vaut rien : si la charge utile est
          # illisible, on le DIT au lieu de conclure « rien a signaler ».
          # jq SEUL puis tri : derriere un pipe, $? est celui de `sort` (qui reussit
          # toujours) et l'echec de jq passerait inapercu.
          if ! raw=$(jq -r '[.commits[]?.added[]?] | .[]' "$GITHUB_EVENT_PATH" 2>/dev/null); then
            echo "::warning::Charge utile de l'evenement illisible — controle des migrations sautees NON effectue"
            exit 0
          fi
          added=$(printf '%s' "$raw" | sort -u)

          skipped=""
          while IFS= read -r f; do
            case "$f" in supabase/migrations/*.sql) ;; *) continue ;; esac
            base=$(basename "$f")
            # MÊME extraction que l'étape d'application ci-dessus : si les deux
            # divergent un jour, cette alerte se met à mentir.
            stamp_date="${base:0:8}"
            case "$stamp_date" in ''|*[!0-9]*) continue ;; esac
            if [ "$stamp_date" -lt "$TODAY" ]; then
              # Saut de ligne via $'\n' (bash) et NON par une chaîne multi-lignes
              # littérale : celle-ci refermerait le scalaire de bloc YAML, la
              # ligne ne portant que le guillemet fermant retombant en colonne 1.
              # Pas de $( ) non plus — la substitution de commande mange le
              # saut de ligne final et recollerait tous les noms sur une ligne.
              skipped="${skipped}${base}"$'\n'
            fi
          done <<< "$added"

          if [ -z "$skipped" ]; then
            echo "OK — aucune migration ajoutee par ce push n'a ete sautee."
            exit 0
          fi

          # Vérification contre supabase_migrations.schema_migrations, la table
          # que Supabase alimente pour suivre les versions de migration déjà
          # appliquées.
          #
          # Hypothèse testée en local le 28 juil. 2026, avant d'écrire ce bloc,
          # sur l'instance Supabase locale de ce dépôt (table inspectée
          # directement en SQL) : si une version y figure, la migration a été
          # appliquée par un outil qui connaît cette table (CLI `db push` ou
          # `migration up`, ou tout outil équivalent côté Management API qui
          # l'alimente explicitement). Cette moitié de l'hypothèse tient :
          # trouvée veut dire appliquée, avec certitude.
          #
          # L'autre moitié ne tient pas. L'étape "Apply Supabase migrations"
          # juste au-dessus, et le remède manuel qu'elle documente plus bas
          # (l'éditeur SQL de Studio), exécutent toutes les deux une requête
          # SQL brute contre la base sans jamais écrire dans schema_migrations :
          # c'est déjà ce que dit son commentaire au sujet de `supabase db push`,
          # qui échoue sur les migrations passées par l'éditeur SQL et jamais
          # tracées là. Revérifié ici en local : rejouer du DDL par le même
          # mécanisme (requête brute) n'ajoute aucune ligne à schema_migrations,
          # et aucun event trigger Postgres ne fait ce lien (les seuls présents
          # sur l'instance locale concernent pg_graphql, PostgREST, pg_cron et
          # pg_net, rien qui touche supabase_migrations). Donc absente ne prouve
          # pas manquante : ça peut aussi vouloir dire "appliquée par le même
          # chemin que la CI elle-même utilise, qui ne trace rien".
          #
          # D'où la règle appliquée plus bas : trouvée, on se tait (preuve
          # suffisante). Pas trouvée, ou vérification impossible (réseau,
          # réponse illisible, token absent), on avertit comme avant, on
          # n'échoue jamais. Un échec dur sur simple absence bloquerait le
          # déploiement (Cloudflare Pages et Edge Functions inclus, ce step les
          # précède) pour tout push dont le rattrapage a suivi à la lettre le
          # remède n°2 documenté plus bas (éditeur SQL). Ce ne serait pas un
          # garde-fou plus strict, ce serait un générateur de faux échecs sur
          # le flux normal du dépôt. Condition précise qui rendrait un échec
          # dur légitime : démontrer que CHAQUE chemin d'application manuelle
          # de ce dépôt écrit dans schema_migrations, ce qui n'est démontré
          # aujourd'hui pour aucun d'entre eux.
          confirmed=""
          unconfirmed="$skipped"
          check_ok=0
          http=000

          if [ -z "$SB_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN absent - verification schema_migrations NON effectuee, avertissement standard applique a toutes les migrations sautees"
          else
            versions_sql=""
            while IFS= read -r base; do
              [ -z "$base" ] && continue
              v="${base%%_*}"
              case "$v" in ''|*[!0-9]*) continue ;; esac
              versions_sql="${versions_sql}'${v}',"
            done <<< "$skipped"
            versions_sql="${versions_sql%,}"

            if [ -n "$versions_sql" ]; then
              query="select version from supabase_migrations.schema_migrations where version = any(array[${versions_sql}]);"
              body=$(jq -Rs '{query: .}' <<< "$query")
              # `if http=$(curl ...)` et non `http=$(curl ...)` seul : sous
              # `set -e`, un curl qui echoue completement (DNS, connexion
              # refusee) ferait avorter tout le step avec la seconde forme.
              # Dans une condition de if, set -e ne s'applique pas a la
              # commande testee, donc un echec reseau tombe proprement dans
              # le else au lieu de tuer le job.
              if http=$(curl -sS -o /tmp/sb_tracked.json -w '%{http_code}' --max-time 15 \
                  -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
                  -H "Authorization: Bearer $SB_TOKEN" \
                  -H "Content-Type: application/json" \
                  -d "$body" 2>/tmp/sb_tracked.err); then
                :
              else
                http=000
              fi

              case "$http" in
                2[0-9][0-9])
                  if jq -e 'type == "array"' /tmp/sb_tracked.json >/dev/null 2>&1; then
                    check_ok=1
                  fi
                  ;;
              esac
            fi
          fi

          if [ "$check_ok" -eq 1 ]; then
            found=$(jq -r '.[].version' /tmp/sb_tracked.json | sort -u)
            confirmed=""
            unconfirmed=""
            while IFS= read -r base; do
              [ -z "$base" ] && continue
              v="${base%%_*}"
              if printf '%s\n' "$found" | grep -qx -- "$v"; then
                confirmed="${confirmed}${base}"$'\n'
              else
                unconfirmed="${unconfirmed}${base}"$'\n'
              fi
            done <<< "$skipped"
          elif [ -n "$SB_TOKEN" ]; then
            echo "::warning::Controle schema_migrations non concluant (reseau, reponse illisible, ou aucune version exploitable, dernier HTTP $http) - avertissement standard applique a toutes les migrations sautees"
          fi

          if [ -n "$confirmed" ]; then
            echo "Confirmees dans supabase_migrations.schema_migrations (deja appliquees, rien a signaler) :"
            printf '%s' "$confirmed" | sed 's/^/  - /'
          fi

          if [ -z "$unconfirmed" ]; then
            echo "OK : toutes les migrations sautees par ce push sont confirmees appliquees."
            exit 0
          fi

          {
            echo "### Migration(s) NON appliquee(s) par la CI"
            echo
            echo "Ajoutees par ce push, mais horodatage anterieur a aujourd'hui (\`$TODAY\` UTC) :"
            echo "le filtre \`stamp >= TODAY\` les a sautees, et **aucun deploiement ulterieur"
            echo "ne les rattrapera**."
            echo
            printf '%s' "$unconfirmed" | sed 's/^/- `/; s/$/`/'
            echo
            if [ "$check_ok" -eq 1 ]; then
              echo "Non trouvee(s) dans \`supabase_migrations.schema_migrations\` : ni la CI ni un"
              echo "outil qui alimente cette table ne l'a appliquee. Ca n'exclut PAS une"
              echo "application via l'editeur SQL (option 2 ci-dessous), qui n'ecrit pas dans"
              echo "cette table non plus : verifiez a la main avant de conclure a un manque reel."
              echo
            fi
            echo "**A faire**, dans cet ordre de preference :"
            echo
            echo "1. **Re-horodater** ces fichiers au jour du merge (\`git mv\`, ordre relatif"
            echo "   conserve) et repousser : le pipeline les applique, et les horodatages"
            echo "   refletent enfin ce qui est reellement en base. C'est le seul remede qui"
            echo "   garde depot et prod en phase. Exige qu'elles soient idempotentes — le"
            echo "   date-guard les rejouera a chaque push de la journee (\`lint:migrations\`)."
            echo "2. Les appliquer a la main (MCP \`apply_migration\` ou SQL editor) si elles"
            echo "   ne peuvent pas etre re-datees."
            echo
            echo "Le schema de la prod diverge du depot tant que ce n'est pas fait — et rien"
            echo "d'autre ne le signalera : la CI backend rejoue TOUT sur une base fraiche,"
            echo "elle reste verte. Cas reel : PR #852 (5 migrations sautees), corrige par #959."
          } >> "$GITHUB_STEP_SUMMARY"

          while IFS= read -r base; do
            [ -z "$base" ] && continue
            echo "::warning file=supabase/migrations/$base::$base n'a PAS ete appliquee par la CI (horodatage < $TODAY) — verifier l'application manuelle"
          done <<< "$unconfirmed"

      - name: Deploy to Cloudflare Pages
        if: env.DEPLOIE_PROD == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Pin wrangler v4 (matches the Rockwell deploy). The V3 Basic Auth
          # gate is sites/megga-vitrine/_worker.js (Advanced mode), copied
          # into dist/ by the postbuild hook — _worker.js is detected natively
          # on every deploy, so megga.ch stays behind Basic Auth. Credentials
          # live in that worker (single source of truth); the auth pages
          # (/login, /signup, /reset-password) are exempt from the gate, since
          # the CRM has no login page of its own and redirects there.
          wranglerVersion: "4.86.0"
          # `--commit-message="deploy <sha>"` court-circuite l'introspection
          # git de wrangler. Sans ça, wrangler pousse le message du HEAD vers
          # l'API Cloudflare, qui a un validateur UTF-8 strict bogué : il
          # rejette certaines séquences Unicode pourtant valides (constaté
          # 2026-05-18 sur un message contenant em-dashes + arrows + accents).
          # Avec un SHA pur ASCII on évite définitivement ce mode de panne.
          # `--commit-dirty=true` silence le warning "uncommitted changes" lié
          # au dist/ buildé localement. NOTE : tout sur une seule ligne — les
          # backslashes de continuation bash ne sont pas interprétés dans un
          # YAML block scalar et wrangler les recevrait comme args littéraux.
          # `--branch=main` forces the production environment so the custom
          # domain (megga.ch) is updated — without it wrangler can infer a
          # detached-HEAD branch in CI and publish a preview-only deployment.
          command: pages deploy dist --project-name=megga-real-estate --branch=main --commit-message="deploy ${{ github.sha }}" --commit-dirty=true

      - name: Link Supabase project and deploy functions
        if: env.DEPLOIE_PROD == 'true'
        # Backstop : si tout le step se bloque (lien réseau, CLI figé), on le
        # tue au bout du délai au lieu de laisser le run pendre des heures.
        # Relevé de 10 à 20 min pour laisser respirer la passe de rattrapage
        # ci-dessous : sous une panne CDN PARTIELLE (esm.sh en 522 sur une partie
        # des fonctions, ~40 s perdues par échec), 10 min ne suffisaient plus à
        # traiter les ~65 fonctions — le step se faisait TUER par ce plafond
        # (constaté 2× le 2026-07-21), pas sortir proprement.
        timeout-minutes: 20
        # Tolère les échecs individuels : si une fonction plante (import
        # deno cassé, secret manquant, etc.), on log et on continue les
        # autres. Le step ne fail que si AUCUNE fonction n'a été déployée.
        run: |
          set +e  # Désactive fail-fast pour la boucle

          supabase link --project-ref eayczugyrvmtqnnmvjod
          LINK_RC=$?
          if [ $LINK_RC -ne 0 ]; then
            echo "::error::supabase link failed (rc=$LINK_RC) — aborting"
            exit $LINK_RC
          fi

          SUCCESS=0
          FAILED=0
          FAILED_FNS=""

          # Toutes les fonctions sont déployées en --no-verify-jwt : la plateforme rejette
          # la clé service-role legacy quand verify_jwt=true (UNAUTHORIZED_LEGACY_JWT), ce
          # qui casserait les appels internes (cron→fn, webhook→fn). L'auth des fonctions
          # internes (whatsapp-agent/process) se fait DANS la fonction (Bearer comparé à la
          # clé service-role, à temps constant). Allowlist vide ; à remplir le jour où une
          # fonction doit exiger un JWT UTILISATEUR vérifié par la plateforme.
          JWT_PROTECTED=""

          for fn_dir in supabase/functions/*/; do
            fn_name=$(basename "$fn_dir")
            if [ -f "$fn_dir/index.ts" ]; then
              echo "::group::Deploying $fn_name"
              # `timeout 180` borne chaque déploiement : si une fonction se fige
              # (observé 2026-06-03 — un deploy a bloqué tout le job 14 min avant
              # annulation manuelle), rc=124 → comptée comme échec et la boucle
              # passe à la suivante au lieu de pendre indéfiniment.
              if echo " $JWT_PROTECTED " | grep -q " $fn_name "; then
                timeout 180 supabase functions deploy "$fn_name"
              else
                timeout 180 supabase functions deploy "$fn_name" --no-verify-jwt
              fi
              RC=$?
              echo "::endgroup::"
              if [ $RC -eq 0 ]; then
                SUCCESS=$((SUCCESS + 1))
              else
                FAILED=$((FAILED + 1))
                FAILED_FNS="$FAILED_FNS $fn_name"
                if [ $RC -eq 124 ]; then
                  echo "::warning::Deployment of $fn_name timed out after 180s — continuing"
                else
                  echo "::warning::Deployment of $fn_name failed (rc=$RC) — continuing"
                fi
              fi
            fi
          done

          # ── Passe de rattrapage ──────────────────────────────────────────
          # Les échecs de bundle viennent presque toujours d'un CDN d'imports
          # (esm.sh / deno.land) qui renvoie un 5xx TRANSITOIRE : constaté 2× le
          # 2026-07-21, esm.sh en 522 sur une PARTIE seulement des fonctions
          # (37 déployées / 11 tombées). On rejoue UNIQUEMENT les fonctions
          # tombées, UNE fois, après une pause — le temps que le CDN se rétablisse.
          # Pas de boucle et seulement l'ensemble des échecs (petit) : la 1re passe
          # a déjà duré quelques minutes, et le budget du step est fini. Correctif
          # de fond (vendoriser les imports) traité séparément.
          if [ -n "$FAILED_FNS" ]; then
            echo "::group::Retry pass — $FAILED fonction(s) tombée(s)"
            echo "Pause 20s avant de rejouer :$FAILED_FNS"
            sleep 20
            RETRY_REMAINING=""
            for fn_name in $FAILED_FNS; do
              echo "Retry $fn_name"
              if echo " $JWT_PROTECTED " | grep -q " $fn_name "; then
                timeout 180 supabase functions deploy "$fn_name"
              else
                timeout 180 supabase functions deploy "$fn_name" --no-verify-jwt
              fi
              if [ $? -eq 0 ]; then
                SUCCESS=$((SUCCESS + 1))
                FAILED=$((FAILED - 1))
                echo "::notice::$fn_name déployée au 2e essai"
              else
                RETRY_REMAINING="$RETRY_REMAINING $fn_name"
                echo "::warning::$fn_name échoue encore après rejeu"
              fi
            done
            FAILED_FNS="$RETRY_REMAINING"
            echo "::endgroup::"
          fi

          echo ""
          echo "═══ Summary ═══"
          echo "  ✅ Deployed : $SUCCESS"
          echo "  ❌ Failed   : $FAILED"
          if [ $FAILED -gt 0 ]; then
            echo "  Failed functions:$FAILED_FNS"
          fi

          # Ne fail le step que si TOUTES les fonctions plantent
          if [ $SUCCESS -eq 0 ] && [ $FAILED -gt 0 ]; then
            echo "::error::All edge function deployments failed"
            exit 1
          fi
          exit 0
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
